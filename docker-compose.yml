# ============================================================================
# docker-compose.yml — CENTRO DE MONITOREO · NQN Petrol (iaserver)
# ============================================================================
# Recorte del stack original: SIN mediamtx (usa el bus /home/pasante/media) y
# SIN nginx propio (lo publica el edge /home/pasante/nginx via conf.d/panel.conf).
# Los 3 servicios corren en proxy-net SIN exponer puertos al host: el edge los
# alcanza por nombre (dashboard:80, auth_service:19100, authelia:9091).
# ============================================================================
services:
  dashboard:
    image: nginx:alpine
    container_name: dashboard
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - proxy-net

  auth_service:
    build: ./auth-service
    container_name: auth_service
    restart: unless-stopped
    environment:
      WEATHERFLOW_TOKEN: ${WEATHERFLOW_TOKEN}
    volumes:
      - ./companies.yml:/app/companies.yml:ro
    networks:
      - proxy-net

  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      # users_database.yml es RW: Authelia escribe metadata de 2FA
      - ./authelia/users_database.yml:/config/users_database.yml
      - authelia_data:/config/data
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
    name: proxy-net

volumes:
  authelia_data:
