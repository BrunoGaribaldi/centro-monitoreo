<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro de Monitoreo · NQN Petrol</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta inspirada en el logo NQN Petrol */
            --color-bg:           #f4f6f9;
            --color-surface:      #ffffff;
            --color-surface-alt:  #eef1f5;
            --color-border:       #d8dee7;
            --color-border-soft:  #e7ebf1;
            --color-text:         #1a2238;
            --color-text-muted:   #6b7488;
            --color-text-soft:    #8a93a6;

            --color-primary:      #0b3a78;   /* azul oscuro del "NQN" */
            --color-primary-hover:#0e4a99;
            --color-accent:       #ff6b1f;   /* naranja del símbolo */
            --color-live:         #16a34a;   /* verde "en vivo" */
            --color-error:        #dc2626;

            --shadow-sm:  0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md:  0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-lg:  0 4px 16px rgba(15, 23, 42, 0.08);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;

            --topbar-h: 64px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ===== Login overlay ===== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .login-overlay.visible { display: flex; }
        body.locked { overflow: hidden; }

        .login-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--color-border-soft);
        }
        .login-brand img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .login-brand-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.2;
        }
        .login-brand-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 3px;
        }
        .login-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text);
            margin: 0 0 4px 0;
        }
        .login-subheading {
            font-size: 12px;
            color: var(--color-text-muted);
            margin: 0 0 24px 0;
        }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .login-field input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            color: var(--color-text);
            background: var(--color-surface);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-field input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 58, 120, 0.10);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }
        .login-btn:hover    { background: var(--color-primary-hover); }
        .login-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .login-error {
            margin-top: 14px;
            padding: 10px 12px;
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.25);
            border-radius: var(--radius-sm);
            color: var(--color-error);
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .login-error.visible { display: block; }
        .login-footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--color-border-soft);
            text-align: center;
            font-size: 12px;
            color: var(--color-text-muted);
        }
        .login-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover { text-decoration: underline; }

        .login-powered {
            margin-top: 14px;
            text-align: center;
            font-size: 10px;
            font-weight: 500;
            color: var(--color-text-soft);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .login-powered a {
            color: var(--color-text-soft);
            text-decoration: none;
            border-bottom: 1px dotted var(--color-border);
            padding-bottom: 1px;
        }
        .login-powered a:hover { color: var(--color-primary); }

        @media (max-width: 480px) {
            .login-card { padding: 28px 22px; }
        }

        /* ===== Topbar ===== */
        .topbar {
            height: var(--topbar-h);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 24px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .brand img {
            height: 36px;
            object-fit: contain;
            display: block;
        }

        .brand-divider {
            width: 1px;
            height: 28px;
            background: var(--color-border);
        }

        .brand-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.2;
            white-space: nowrap;
        }
        .brand-subtitle {
            font-size: 11px;
            font-weight: 500;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 2px;
        }

        /* ===== Toolbar (filtros + sizer + pager) ===== */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            padding-right: 8px;
        }
        .toolbar::-webkit-scrollbar { height: 4px; }
        .toolbar::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .toolbar-group-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-text-soft);
        }

        /* ----- Filtros (selects) ----- */
        .filter-select {
            appearance: none;
            -webkit-appearance: none;
            padding: 7px 30px 7px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            color: var(--color-text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%236b7488'%3e%3cpath d='M4 6l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
        }
        .filter-select:hover { border-color: var(--color-primary); }
        .filter-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 58, 120, 0.10);
        }
        .filter-select.is-default {
            color: var(--color-text-muted);
            font-weight: 400;
        }

        /* ----- Selector de tamaño de grid ----- */
        .grid-sizer {
            display: inline-flex;
            background: var(--color-surface-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 3px;
            gap: 2px;
        }
        .size-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 30px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .size-btn:hover {
            background: var(--color-surface);
            color: var(--color-text);
        }
        .size-btn.active {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.15);
        }
        .grid-icon {
            display: grid;
            grid-template-columns: repeat(var(--icon-cols, 2), 1fr);
            gap: 1.5px;
            width: 16px;
            height: 16px;
        }
        .grid-icon span {
            background: currentColor;
            border-radius: 1px;
            min-width: 0;
            min-height: 0;
        }
        .grid-icon.single span {
            border-radius: 2px;
        }

        /* ----- Paginación ----- */
        .pager {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pager-info {
            font-size: 12px;
            color: var(--color-text-muted);
            white-space: nowrap;
            min-width: 70px;
            text-align: center;
        }
        .pager-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            color: var(--color-text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
        }
        .pager-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        .pager-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ----- Acciones (logout) ----- */
        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            padding-left: 12px;
            border-left: 1px solid var(--color-border);
        }
        .actions button {
            padding: 8px 14px;
            background: var(--color-surface);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .actions button:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-surface-alt);
        }
        .logout-btn:hover {
            border-color: var(--color-error) !important;
            color: var(--color-error) !important;
        }

        /* ===== Grid ===== */
        .grid {
            flex: 1;
            display: grid;
            gap: 12px;
            padding: 16px;
            overflow: hidden;
            grid-template-columns: repeat(var(--cols, 1), 1fr);
            grid-auto-rows: 1fr;
        }
        .grid.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .empty-state {
            max-width: 360px;
            text-align: center;
            color: var(--color-text-muted);
        }
        .empty-state .icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.4;
        }
        .empty-state h3 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text);
        }
        .empty-state p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .camara {
            background: #0a0a0a;
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            min-width: 0;
            min-height: 0;
            box-shadow: var(--shadow-md);
        }

        /* Slot vacío (cuando hay menos cámaras que slots elegidos) */
        .celda-vacia {
            background: var(--color-surface-alt);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            color: var(--color-text-soft);
            font-size: 12px;
        }
        .celda-vacia .icono {
            font-size: 22px;
            opacity: 0.4;
            margin-bottom: 4px;
        }
        .celda-vacia .texto {
            text-align: center;
            line-height: 1.3;
        }
        .celda-vacia-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            opacity: 0.7;
        }

        .camara video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .titulo-cam {
            position: absolute;
            top: 12px;
            left: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
            z-index: 10;
            pointer-events: none;
        }
        .titulo-cam .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-text-soft);
            transition: background 0.2s;
        }
        .titulo-cam.live .live-dot {
            background: var(--color-live);
            box-shadow: 0 0 8px rgba(22, 163, 74, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        .titulo-cam.error .live-dot {
            background: var(--color-error);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }

        .estado {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #c8cdd6;
            font-size: 13px;
            pointer-events: none;
            background: rgba(10, 10, 10, 0.4);
        }
        .estado.hidden { display: none; }
        .estado.error { color: #f0a8a8; }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 720px) {
            .topbar { padding: 0 14px; gap: 14px; height: auto; min-height: var(--topbar-h); flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
            .brand-divider, .brand-title-wrap { display: none; }
            .actions { padding-left: 0; border-left: none; }
            .grid { padding: 8px; gap: 8px; }
            .titulo-cam { font-size: 11px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <!-- Overlay de login (visible solo si /center-auth/cameras devuelve 401).
         Por debajo postea a /authelia/api/firstfactor; la cookie de sesión
         queda seteada por Authelia y el dashboard puede consumir la API. -->
    <div class="login-overlay" id="login-overlay" aria-hidden="true">
        <form class="login-card" id="login-form" autocomplete="on">
            <div class="login-brand">
                <img src="images.png" alt="NQN Petrol">
                <div>
                    <div class="login-brand-title">Centro de Monitoreo</div>
                    <div class="login-brand-sub">Streaming en vivo</div>
                </div>
            </div>

            <h2 class="login-heading">Ingresar</h2>
            <p class="login-subheading">Usá tu usuario y contraseña asignados.</p>

            <div class="login-field">
                <label for="login-username">Usuario</label>
                <input type="text" id="login-username" name="username"
                       autocomplete="username" autocapitalize="none"
                       spellcheck="false" required>
            </div>
            <div class="login-field">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-btn" id="login-btn">Ingresar</button>
            <div class="login-error" id="login-error" role="alert"></div>

            <div class="login-footer">
                ¿Olvidaste tu contraseña? Avisale al administrador.
            </div>
            <div class="login-powered">
                Powered by <a href="https://www.authelia.com" target="_blank" rel="noopener">Authelia</a>
            </div>
        </form>
    </div>

    <header class="topbar">
        <div class="brand">
            <img src="images.png" alt="NQN Petrol">
            <div class="brand-divider"></div>
            <div class="brand-title-wrap">
                <div class="brand-title">Centro de Monitoreo</div>
                <div class="brand-subtitle">Streaming en vivo</div>
            </div>
        </div>

        <div class="toolbar" id="toolbar">
            <!-- Filtros drill-down: el contenido depende del rol del user. -->
            <div class="toolbar-group" id="filters"></div>

            <!-- Selector de tamaño de cuadrícula (1, 4, 9, 16, 25). -->
            <div class="toolbar-group">
                <span class="toolbar-group-title">Cuadrícula</span>
                <div class="grid-sizer" id="grid-sizer">
                    <button type="button" class="size-btn" data-size="1" title="1 cámara">
                        <span class="grid-icon single" style="--icon-cols:1"><span></span></span>
                    </button>
                    <button type="button" class="size-btn" data-size="4" title="2 × 2 = 4 cámaras">
                        <span class="grid-icon" style="--icon-cols:2">
                            <span></span><span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="9" title="3 × 3 = 9 cámaras">
                        <span class="grid-icon" style="--icon-cols:3">
                            <span></span><span></span><span></span>
                            <span></span><span></span><span></span>
                            <span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="16" title="4 × 4 = 16 cámaras">
                        <span class="grid-icon" style="--icon-cols:4">
                            <span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="25" title="5 × 5 = 25 cámaras">
                        <span class="grid-icon" style="--icon-cols:5">
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                        </span>
                    </button>
                </div>
            </div>

            <!-- Paginación (visible solo si hay más cámaras filtradas que slots). -->
            <div class="toolbar-group pager" id="pager" hidden>
                <button type="button" class="pager-btn" id="pager-prev" title="Página anterior">‹</button>
                <span class="pager-info" id="pager-info">1 / 1</span>
                <button type="button" class="pager-btn" id="pager-next" title="Página siguiente">›</button>
            </div>
        </div>

        <div class="actions">
            <button class="logout-btn" id="btn-logout" title="Cerrar sesión">Salir</button>
        </div>
    </header>

    <main class="grid" id="grid"></main>

    <script>
        // ==================================================================
        // Autenticación
        // ==================================================================
        // Authelia maneja la sesión vía cookie HttpOnly. El login lo hace
        // el overlay de esta misma página posteando a /authelia/api/firstfactor;
        // si el user activó 2FA, redirigimos al portal solo en ese caso.
        const API_CAMERAS    = "/center-auth/cameras";
        const API_FIRSTFACTOR = "/authelia/api/firstfactor";
        const PORTAL_AUTHELIA = "/authelia/";

        function mostrarLogin(msg) {
            cerrarTodo();
            const overlay = document.getElementById("login-overlay");
            const errEl   = document.getElementById("login-error");
            overlay.classList.add("visible");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("locked");
            if (msg) {
                errEl.textContent = msg;
                errEl.classList.add("visible");
            } else {
                errEl.textContent = "";
                errEl.classList.remove("visible");
            }
            setTimeout(() => document.getElementById("login-username").focus(), 50);
        }
        function ocultarLogin() {
            const overlay = document.getElementById("login-overlay");
            overlay.classList.remove("visible");
            overlay.setAttribute("aria-hidden", "true");
            document.body.classList.remove("locked");
            document.getElementById("login-error").classList.remove("visible");
        }

        // ==================================================================
        // Configuración de cámaras (dinámica — cargada desde /center-auth/cameras)
        // ==================================================================
        // CAMARAS es la lista plana. JERARQUIA agrupa por empresa → site → cameras
        // para alimentar los dropdowns drill-down de la toolbar.
        const CAMARAS = [];
        let   JERARQUIA = {};          // { empresaId: { display, sites: { siteId: { display, cameras: [...] } } } }
        let   ROL_USER = null;         // "superadmin" | "admin_empresa" | "admin_site" | "viewer_drone"
        let   EMPRESA_USER = null;     // ID de empresa del user (null para superadmin)

        const RETRY_MS       = 4000;
        const ICE_TIMEOUT_MS = 4000;

        // ---- Estado de UI (filtros + tamaño de grid + página) ----
        const STORAGE_FILTROS = "centro-monitoreo:filtros";
        const STORAGE_SIZE    = "centro-monitoreo:gridSize";
        const TAMANOS_VALIDOS = [1, 4, 9, 16, 25];
        const COLS_POR_TAMANO = { 1: 1, 4: 2, 9: 3, 16: 4, 25: 5 };
        const TAMANO_DEFAULT  = 9;

        let filtros = { empresa: "", site: "", drone: "" };   // "" = "Todos"
        let gridSize = TAMANO_DEFAULT;
        let pagina = 0;

        function configurarCamaras(data) {
            const sites = (data && data.sites) || [];
            ROL_USER     = (data && data.rol) || null;
            EMPRESA_USER = (data && data.empresa) || null;

            CAMARAS.length = 0;
            JERARQUIA = {};

            for (const site of sites) {
                // Para superadmin, site.empresa viene con el display name de la empresa.
                // Para los demás roles no viene → usamos EMPRESA_USER como id y display.
                const empresaId   = site.empresa ? site.empresa : (EMPRESA_USER || "—");
                const empresaShow = site.empresa || EMPRESA_USER || "—";

                if (!JERARQUIA[empresaId]) {
                    JERARQUIA[empresaId] = { display: empresaShow, sites: {} };
                }
                JERARQUIA[empresaId].sites[site.site] = {
                    display: site.display,
                    cameras: site.cameras,
                };

                for (const cam of site.cameras) {
                    CAMARAS.push({
                        path:        cam.path,
                        titulo:      cam.titulo || cam.path,
                        site:        site.site,
                        siteDisplay: site.display,
                        empresa:     empresaId,
                        empresaShow: empresaShow,
                    });
                }
            }

            cargarPreferenciasUI();
        }

        function cargarPreferenciasUI() {
            // Tamaño de grid
            try {
                const raw = localStorage.getItem(STORAGE_SIZE);
                const n = parseInt(raw, 10);
                gridSize = TAMANOS_VALIDOS.includes(n) ? n : TAMANO_DEFAULT;
            } catch { gridSize = TAMANO_DEFAULT; }

            // Filtros (solo lo que sea consistente con las cámaras visibles)
            filtros = { empresa: "", site: "", drone: "" };
            try {
                const raw = JSON.parse(localStorage.getItem(STORAGE_FILTROS) || "{}");
                if (raw.empresa && JERARQUIA[raw.empresa]) {
                    filtros.empresa = raw.empresa;
                    if (raw.site && JERARQUIA[raw.empresa].sites[raw.site]) {
                        filtros.site = raw.site;
                        if (raw.drone && JERARQUIA[raw.empresa].sites[raw.site].cameras.some(c => extraerDrone(c.path) === raw.drone)) {
                            filtros.drone = raw.drone;
                        }
                    }
                }
            } catch {}
            pagina = 0;
        }

        function guardarPreferenciasUI() {
            try { localStorage.setItem(STORAGE_SIZE, String(gridSize)); } catch {}
            try { localStorage.setItem(STORAGE_FILTROS, JSON.stringify(filtros)); } catch {}
        }

        // Deriva el "drone" desde el path. Ej: "dron-cam-q1-angular" → "q1",
        // "dock-cam-dock-1" → "dock-1". Lo usamos para agrupar las 3-4 cámaras
        // de un mismo dron en el dropdown de drones.
        function extraerDrone(path) {
            let m = path.match(/^dron-cam-(q\d+)/);
            if (m) return m[1];
            m = path.match(/^dock-cam-(dock-\d+)/);
            if (m) return m[1];
            return path;
        }

        function labelDrone(drone) {
            if (drone.startsWith("q"))    return "Q" + drone.slice(1);
            if (drone.startsWith("dock-")) return "Dock " + drone.slice(5);
            return drone;
        }

        // ==================================================================
        // Cámaras filtradas + paginación
        // ==================================================================
        function camarasFiltradas() {
            return CAMARAS.filter(cam => {
                if (filtros.empresa && cam.empresa !== filtros.empresa) return false;
                if (filtros.site    && cam.site    !== filtros.site)    return false;
                if (filtros.drone   && extraerDrone(cam.path) !== filtros.drone) return false;
                return true;
            });
        }

        function totalPaginas() {
            const total = camarasFiltradas().length;
            return Math.max(1, Math.ceil(total / gridSize));
        }

        function camarasEnPaginaActual() {
            const todas = camarasFiltradas();
            const ini = pagina * gridSize;
            return todas.slice(ini, ini + gridSize);
        }

        async function iniciarApp() {
            try {
                const r = await fetch(API_CAMERAS, { credentials: "same-origin" });
                if (r.status === 401) { mostrarLogin(); return; }
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                ocultarLogin();
                configurarCamaras(data);
                renderToolbar();
                renderGrid();
            } catch (err) {
                console.warn("No se pudo cargar /center-auth/cameras:", err);
                document.getElementById("grid").innerHTML =
                    '<div style="padding:40px;font-family:sans-serif;color:#dc2626">' +
                    'Error de red al cargar las cámaras. Recargá la página.</div>';
            }
        }

        // ==================================================================
        // Form de login → /authelia/api/firstfactor
        // ==================================================================
        // Authelia expone una API que el portal nativo usa por debajo.
        // Posteamos JSON con username/password, Authelia setea la cookie
        // de sesión, y volvemos a llamar a /center-auth/cameras (esta vez
        // con cookie válida) para renderizar el grid sin reload.
        //
        // Si el user tiene 2FA activado, Authelia devuelve un redirect que
        // contiene /2fa/ → en ese caso redirigimos al portal nativo SOLO
        // para esa parte (es una vez en la vida del usuario).
        document.getElementById("login-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const userEl = document.getElementById("login-username");
            const passEl = document.getElementById("login-password");
            const btn    = document.getElementById("login-btn");
            const errEl  = document.getElementById("login-error");

            const username = userEl.value.trim();
            const password = passEl.value;
            if (!username || !password) {
                errEl.textContent = "Ingresá usuario y contraseña.";
                errEl.classList.add("visible");
                return;
            }

            btn.disabled    = true;
            btn.textContent = "Ingresando…";
            errEl.classList.remove("visible");

            try {
                const r = await fetch(API_FIRSTFACTOR, {
                    method:      "POST",
                    credentials: "same-origin",
                    headers:     { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        password,
                        keepMeLoggedIn: false,
                        targetURL:      window.location.href,
                        requestMethod:  "GET",
                    }),
                });

                let data = {};
                try { data = await r.json(); } catch {}

                if (!r.ok || data.status !== "OK") {
                    const msg = (data && data.message) || "Credenciales incorrectas.";
                    errEl.textContent = msg;
                    errEl.classList.add("visible");
                    passEl.value = "";
                    passEl.focus();
                    return;
                }

                // Si Authelia pide pasos adicionales (2FA u otro), redirige al portal.
                // Si el redirect apunta al propio dashboard (misma origin, fuera de /authelia/),
                // lo ignoramos y cargamos la app directamente sin navegar.
                const redirect = data.data && data.data.redirect;
                if (redirect) {
                    try {
                        const url = new URL(redirect, window.location.origin);
                        const esDashboard = url.origin === window.location.origin &&
                                            !url.pathname.startsWith("/authelia");
                        if (!esDashboard) { window.location.href = redirect; return; }
                    } catch {}
                }

                // Login OK y sin 2FA pendiente — cookie ya está seteada.
                passEl.value = "";
                ocultarLogin();
                await iniciarApp();
            } catch (err) {
                console.warn("Error en login:", err);
                errEl.textContent = "Error de red. Probá de nuevo.";
                errEl.classList.add("visible");
            } finally {
                btn.disabled    = false;
                btn.textContent = "Ingresar";
            }
        });

        document.getElementById("btn-logout").addEventListener("click", async () => {
            cerrarTodo();
            // Llama al endpoint de logout de Authelia para que limpie la cookie,
            // pero sin navegar: el usuario se queda en el dashboard y ve el overlay.
            try { await fetch("/authelia/logout", { credentials: "same-origin" }); } catch {}
            mostrarLogin();
        });

        // ==================================================================
        // Compatibilidad
        // ==================================================================
        if (typeof RTCPeerConnection === "undefined") {
            document.body.innerHTML =
                '<div style="padding:40px;font-family:sans-serif;color:#dc2626">' +
                '<h2>Navegador no compatible</h2>' +
                '<p>Este dashboard requiere soporte de WebRTC. Usá Chrome, Edge o Firefox actualizados.</p>' +
                '</div>';
            throw new Error("WebRTC no soportado");
        }

        // ==================================================================
        // Estado de conexiones WebRTC
        // ==================================================================
        // path -> { pc, retryTimer, generation }
        const conexiones = new Map();

        // ==================================================================
        // Toolbar: filtros (drill-down según rol) + sizer + paginación
        // ==================================================================
        function renderToolbar() {
            renderFilters();
            renderGridSizer();
            renderPager();
        }

        function renderFilters() {
            const cont = document.getElementById("filters");
            cont.innerHTML = "";

            // Reglas por rol:
            //   superadmin    → dropdown de empresa + site (si empresa elegida) + drone (si site elegido)
            //   admin_empresa → dropdown de site + drone (si site elegido)
            //   admin_site    → dropdown de site (solo si tiene >1) + drone (si site elegido)
            //   viewer_drone  → sin filtros (solo tiene 1 cámara/dron)
            if (ROL_USER === "viewer_drone") return;

            // --- Empresa (solo superadmin) ---
            if (ROL_USER === "superadmin") {
                const empresas = Object.keys(JERARQUIA).sort();
                const opciones = [
                    { value: "", label: "Todas las empresas" },
                    ...empresas.map(e => ({ value: e, label: JERARQUIA[e].display })),
                ];
                cont.appendChild(crearSelect("Empresa", filtros.empresa, opciones, (v) => {
                    filtros.empresa = v;
                    // resetear filtros más específicos
                    filtros.site = "";
                    filtros.drone = "";
                    aplicarFiltros();
                }));
            }

            // --- Site ---
            // Determinar de qué empresa sacamos los sites:
            //   superadmin con empresa elegida → esa empresa
            //   superadmin sin empresa elegida → no mostramos site (sería confuso)
            //   admin_empresa / admin_site     → la suya
            let empresaParaSites = null;
            if (ROL_USER === "superadmin" && filtros.empresa) {
                empresaParaSites = filtros.empresa;
            } else if (ROL_USER === "admin_empresa" || ROL_USER === "admin_site") {
                // Hay una única empresa en JERARQUIA para estos roles.
                empresaParaSites = Object.keys(JERARQUIA)[0] || null;
            }
            if (empresaParaSites && JERARQUIA[empresaParaSites]) {
                const sites = Object.keys(JERARQUIA[empresaParaSites].sites).sort();
                if (sites.length > 1 || ROL_USER === "superadmin") {
                    const opciones = [
                        { value: "", label: "Todos los sitios" },
                        ...sites.map(s => ({ value: s, label: JERARQUIA[empresaParaSites].sites[s].display })),
                    ];
                    cont.appendChild(crearSelect("Sitio", filtros.site, opciones, (v) => {
                        filtros.site = v;
                        filtros.drone = "";
                        aplicarFiltros();
                    }));
                }
            }

            // --- Drone (solo si hay site elegido) ---
            if (filtros.site && empresaParaSites && JERARQUIA[empresaParaSites] &&
                JERARQUIA[empresaParaSites].sites[filtros.site]) {
                const camsDelSite = JERARQUIA[empresaParaSites].sites[filtros.site].cameras;
                const drones = [...new Set(camsDelSite.map(c => extraerDrone(c.path)))].sort();
                if (drones.length > 1) {
                    const opciones = [
                        { value: "", label: "Todos los drones" },
                        ...drones.map(d => ({ value: d, label: labelDrone(d) })),
                    ];
                    cont.appendChild(crearSelect("Dron", filtros.drone, opciones, (v) => {
                        filtros.drone = v;
                        aplicarFiltros();
                    }));
                }
            }
        }

        function crearSelect(titulo, valorActual, opciones, onChange) {
            const wrap = document.createElement("label");
            wrap.className = "toolbar-group";
            wrap.style.gap = "6px";
            wrap.innerHTML = `<span class="toolbar-group-title">${titulo}</span>`;
            const sel = document.createElement("select");
            sel.className = "filter-select" + (valorActual ? "" : " is-default");
            for (const op of opciones) {
                const optEl = document.createElement("option");
                optEl.value = op.value;
                optEl.textContent = op.label;
                if (op.value === valorActual) optEl.selected = true;
                sel.appendChild(optEl);
            }
            sel.addEventListener("change", () => onChange(sel.value));
            wrap.appendChild(sel);
            return wrap;
        }

        function aplicarFiltros() {
            pagina = 0;
            guardarPreferenciasUI();
            renderToolbar();
            renderGrid();
        }

        function renderGridSizer() {
            const sizer = document.getElementById("grid-sizer");
            for (const btn of sizer.querySelectorAll(".size-btn")) {
                const n = parseInt(btn.dataset.size, 10);
                btn.classList.toggle("active", n === gridSize);
            }
        }

        document.querySelectorAll("#grid-sizer .size-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const n = parseInt(btn.dataset.size, 10);
                if (!TAMANOS_VALIDOS.includes(n) || n === gridSize) return;
                gridSize = n;
                pagina = 0;       // recálculo de páginas
                guardarPreferenciasUI();
                renderToolbar();
                renderGrid();
            });
        });

        function renderPager() {
            const pager  = document.getElementById("pager");
            const info   = document.getElementById("pager-info");
            const prev   = document.getElementById("pager-prev");
            const next   = document.getElementById("pager-next");
            const total  = totalPaginas();
            const visibleHay = camarasFiltradas().length;

            if (visibleHay <= gridSize) {
                pager.hidden = true;
                return;
            }
            pager.hidden = false;
            info.textContent = `${pagina + 1} / ${total}`;
            prev.disabled = pagina === 0;
            next.disabled = pagina >= total - 1;
        }

        document.getElementById("pager-prev").addEventListener("click", () => {
            if (pagina > 0) { pagina--; renderToolbar(); renderGrid(); }
        });
        document.getElementById("pager-next").addEventListener("click", () => {
            if (pagina < totalPaginas() - 1) { pagina++; renderToolbar(); renderGrid(); }
        });

        // ==================================================================
        // Grid: N slots fijos según gridSize, llenados con cámaras filtradas
        // ==================================================================
        // Importante: las cámaras que sobreviven entre renders (mismos paths
        // siguen en pantalla cuando solo cambió el sizer o el filtro vecino)
        // NO se reconectan — mantenemos su <video> y su RTCPeerConnection.
        // Solo desconectamos lo que se va y conectamos lo que entra nuevo.
        function renderGrid() {
            const grid = document.getElementById("grid");
            const cams = camarasEnPaginaActual();
            const pathsEnPagina = new Set(cams.map(c => c.path));

            // 1) Desconectar cámaras que ya no están en la página y quitar
            //    su celda del DOM.
            for (const celda of [...grid.querySelectorAll(".camara")]) {
                if (!pathsEnPagina.has(celda.dataset.path)) {
                    desconectar(celda.dataset.path);
                    celda.remove();
                }
            }
            // 2) Eliminar todos los placeholders (los recreamos en orden).
            for (const vacia of [...grid.querySelectorAll(".celda-vacia")]) {
                vacia.remove();
            }

            grid.classList.remove("empty");
            grid.style.setProperty("--cols", COLS_POR_TAMANO[gridSize]);

            // 3) Construir el grid en el orden deseado. Para cámaras que ya
            //    existían, appendChild() mueve el nodo sin destruirlo.
            for (let i = 0; i < gridSize; i++) {
                const cam = cams[i];
                if (cam) {
                    const sel = `.camara[data-path="${CSS.escape(cam.path)}"]`;
                    let celda = grid.querySelector(sel);
                    if (!celda) {
                        celda = crearCelda(cam);
                        grid.appendChild(celda);
                        conectar(cam.path, celda);
                    } else {
                        grid.appendChild(celda);   // solo reordena
                    }
                } else {
                    grid.appendChild(crearCeldaVacia());
                }
            }
        }

        function crearCeldaVacia() {
            const div = document.createElement("div");
            div.className = "celda-vacia";
            div.innerHTML = `
                <div class="celda-vacia-inner">
                    <div class="icono">○</div>
                    <div class="texto">Sin cámara</div>
                </div>`;
            return div;
        }

        function crearCelda(cam) {
            const celda = document.createElement("div");
            celda.className = "camara";
            celda.dataset.path = cam.path;
            celda.innerHTML = `
                <div class="titulo-cam">
                    <span class="live-dot"></span>
                    <span class="texto"></span>
                </div>
                <video autoplay muted playsinline></video>
                <div class="estado">
                    <div class="spinner"></div>
                    <span class="msg">Conectando…</span>
                </div>
            `;
            celda.querySelector(".titulo-cam .texto").textContent = cam.titulo;
            return celda;
        }

        function setEstado(celda, modo, mensaje) {
            const estadoEl = celda.querySelector(".estado");
            const tituloEl = celda.querySelector(".titulo-cam");
            const msgEl    = estadoEl.querySelector(".msg");
            const spinner  = estadoEl.querySelector(".spinner");

            tituloEl.classList.remove("live", "error");

            if (modo === "live") {
                estadoEl.classList.add("hidden");
                tituloEl.classList.add("live");
                return;
            }

            estadoEl.classList.remove("hidden", "error");
            if (modo === "loading") {
                spinner.style.display = "block";
                msgEl.textContent = mensaje || "Conectando…";
            } else if (modo === "error") {
                spinner.style.display = "none";
                estadoEl.classList.add("error");
                tituloEl.classList.add("error");
                msgEl.textContent = mensaje || "Sin señal";
            }
        }

        // ==================================================================
        // Cliente WHEP (non-trickle) con Authorization header
        // ==================================================================
        async function conectar(path, celda) {
            const prev = conexiones.get(path);
            if (prev?.retryTimer) clearTimeout(prev.retryTimer);

            const generation = (prev?.generation || 0) + 1;
            conexiones.set(path, { pc: null, retryTimer: null, generation });

            const videoEl = celda.querySelector("video");
            setEstado(celda, "loading", "Conectando…");

            let pc = null;
            try {
                pc = new RTCPeerConnection();
                pc.addTransceiver("video", { direction: "recvonly" });

                pc.ontrack = (ev) => {
                    if (!esActual(path, generation)) return;
                    const [stream] = ev.streams;
                    if (videoEl.srcObject !== stream) videoEl.srcObject = stream;
                    setEstado(celda, "live");
                };

                pc.oniceconnectionstatechange = () => {
                    if (!esActual(path, generation)) return;
                    const s = pc.iceConnectionState;
                    if (s === "failed" || s === "disconnected" || s === "closed") {
                        if (conexiones.has(path)) programarReintento(path, celda, "Conexión perdida");
                    }
                };

                const offer = await pc.createOffer();
                if (!esActual(path, generation)) return cleanup(pc);
                await pc.setLocalDescription(offer);
                await esperarIceComplete(pc);
                if (!esActual(path, generation)) return cleanup(pc);

                const resp = await fetch(`/webrtc/${path}/whep`, {
                    method:  "POST",
                    headers: { "Content-Type": "application/sdp" },
                    credentials: "same-origin",
                    body: pc.localDescription.sdp,
                });

                if (!esActual(path, generation)) return cleanup(pc);

                // Sesión Authelia caducada — pedir login otra vez
                if (resp.status === 401) {
                    cleanup(pc);
                    if (esActual(path, generation)) mostrarLogin("Sesión expirada. Ingresá de nuevo.");
                    return;
                }

                if (!resp.ok) {
                    const txt    = await resp.text().catch(() => "");
                    const motivo = resp.status === 404 || /not found/i.test(txt)
                        ? "Sin señal"
                        : `Error ${resp.status}`;
                    throw new Error(motivo);
                }

                const answerSdp = await resp.text();
                await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
                if (!esActual(path, generation)) return cleanup(pc);

                const conn = conexiones.get(path);
                if (conn) conn.pc = pc;
            } catch (err) {
                cleanup(pc);
                if (!esActual(path, generation)) return;
                console.warn(`[${path}]`, err?.message || err);
                programarReintento(path, celda, err?.message || "Sin señal");
            }
        }

        function esActual(path, generation) {
            const conn = conexiones.get(path);
            return conn && conn.generation === generation && conexiones.has(path);
        }

        function cleanup(pc) {
            if (pc) try { pc.close(); } catch {}
        }

        function programarReintento(path, celda, mensaje) {
            const prev = conexiones.get(path);
            if (prev?.pc) cleanup(prev.pc);
            if (prev?.retryTimer) clearTimeout(prev.retryTimer);

            const videoEl = celda.querySelector("video");
            videoEl.srcObject = null;
            setEstado(celda, "error", `${mensaje} · reintentando…`);

            const t = setTimeout(() => {
                if (conexiones.has(path)) conectar(path, celda);
            }, RETRY_MS);

            conexiones.set(path, { pc: null, retryTimer: t, generation: (prev?.generation || 0) });
        }

        function desconectar(path) {
            const conn = conexiones.get(path);
            if (!conn) return;
            if (conn.pc) cleanup(conn.pc);
            if (conn.retryTimer) clearTimeout(conn.retryTimer);
            conexiones.delete(path);
        }

        function cerrarTodo() {
            for (const path of [...conexiones.keys()]) desconectar(path);
        }

        function esperarIceComplete(pc) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === "complete") return resolve();
                const onChange = () => {
                    if (pc.iceGatheringState === "complete") {
                        pc.removeEventListener("icegatheringstatechange", onChange);
                        resolve();
                    }
                };
                pc.addEventListener("icegatheringstatechange", onChange);
                setTimeout(() => {
                    pc.removeEventListener("icegatheringstatechange", onChange);
                    resolve();
                }, ICE_TIMEOUT_MS);
            });
        }

        // ==================================================================
        // Boot
        // ==================================================================
        iniciarApp();

        window.addEventListener("beforeunload", cerrarTodo);
    </script>
</body>
</html>
