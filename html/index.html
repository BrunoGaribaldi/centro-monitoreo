                    if (!esActual(path, generation)) return;
                    const s = pc.iceConnectionState;
                    if (s === "failed" || s === "disconnected" || s === "closed") {
                        if (conexiones.has(path)) programarReintento(path, celda, "Conexión perdida");
                    }
                };

                const offer = await pc.createOffer();
                if (!esActual(path, generation)) return cleanup(pc);
                await pc.setLocalDescription(offer);
                await esperarIceComplete(pc);
                if (!esActual(path, generation)) return cleanup(pc);

                const resp = await fetch(`/webrtc/${path}/whep`, {
                    method:  "POST",
                    headers: { "Content-Type": "application/sdp" },
                    credentials: "same-origin",
                    body: pc.localDescription.sdp,
                });

                if (!esActual(path, generation)) return cleanup(pc);

                // Sesión Authelia caducada — pedir login otra vez
                if (resp.status === 401) {
                    cleanup(pc);
                    if (esActual(path, generation)) mostrarLogin("Sesión expirada. Ingresá de nuevo.");
                    return;
                }

                if (!resp.ok) {
                    const txt    = await resp.text().catch(() => "");
                    const motivo = resp.status === 404 || /not found/i.test(txt)
                        ? "Sin señal"
                        : `Error ${resp.status}`;
                    throw new Error(motivo);
                }

                const answerSdp = await resp.text();
                await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
                if (!esActual(path, generation)) return cleanup(pc);

                const conn = conexiones.get(path);
                if (conn) conn.pc = pc;
            } catch (err) {
                cleanup(pc);
                if (!esActual(path, generation)) return;
                console.warn(`[${path}]`, err?.message || err);
                programarReintento(path, celda, err?.message || "Sin señal");
            }
        }

        function esActual(path, generation) {
            const conn = conexiones.get(path);
            return conn && conn.generation === generation && conexiones.has(path);
        }

        function cleanup(pc) {
            if (pc) try { pc.close(); } catch {}
        }

        function programarReintento(path, celda, mensaje) {
            const prev = conexiones.get(path);
            if (prev?.pc) cleanup(prev.pc);
            if (prev?.retryTimer) clearTimeout(prev.retryTimer);

            const videoEl = celda.querySelector("video");
            videoEl.srcObject = null;
            setEstado(celda, "error", `${mensaje} · reintentando…`);

            const t = setTimeout(() => {
                if (conexiones.has(path)) conectar(path, celda);
            }, RETRY_MS);

            conexiones.set(path, { pc: null, retryTimer: t, generation: (prev?.generation || 0) });
        }

        function desconectar(path) {
            const conn = conexiones.get(path);
            if (!conn) return;
            if (conn.pc) cleanup(conn.pc);
            if (conn.retryTimer) clearTimeout(conn.retryTimer);
            conexiones.delete(path);
        }

        function cerrarTodo() {
            for (const path of [...conexiones.keys()]) desconectar(path);
        }

        function esperarIceComplete(pc) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === "complete") return resolve();
                const onChange = () => {
                    if (pc.iceGatheringState === "complete") {
                        pc.removeEventListener("icegatheringstatechange", onChange);
                        resolve();
                    }
                };
                pc.addEventListener("icegatheringstatechange", onChange);
                setTimeout(() => {
                    pc.removeEventListener("icegatheringstatechange", onChange);
                    resolve();
                }, ICE_TIMEOUT_MS);
            });
        }

        // ==================================================================
        // Boot
        // ==================================================================
        // ==================================================================
        // Módulo de meteorología (WeatherFlow Tempest)
        // ==================================================================
        // El widget de la topbar muestra el clima del site filtrado (o de la
        // única estación que el user tenga si solo hay 1). Click → modal con
        // detalle completo. Polling cada 30s contra /center-auth/weather/<id>.
        const WEATHER_POLL_MS = 30_000;
        const WEATHER_DEFAULT_LIMITS = {
            wind_avg_warn:       10,    // m/s
            wind_avg_danger:     12,
            wind_gust_warn:      15,
            wind_gust_danger:    17,
            lightning_warn_km:   30,
            lightning_danger_km: 10,
        };

        const stationsDisponibles = [];   // [{station_id, display, site, ...}]
        let   weatherStationActiva = null;
        let   weatherPollTimer = null;
        let   weatherUltimoFetch = null;  // {station, observation, semaforo, motivos, ts}

        async function cargarWeatherStations() {
            stationsDisponibles.length = 0;
            try {
                const r = await fetch("/center-auth/weather/stations", { credentials: "same-origin" });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                stationsDisponibles.push(...(data.stations || []));
            } catch (err) {
                console.warn("weather: no se pudieron cargar estaciones", err);
            }
            renderWeatherWidget();
        }

        function elegirStationAuto() {
            if (stationsDisponibles.length === 0) return null;
            // Si el user filtró por un sitio específico, priorizar la estación
            // de ese sitio. Si no, usar la primera disponible (o la activa
            // anterior si sigue en la lista).
            const sitesFiltrados = [...filtros.sites];
            if (sitesFiltrados.length === 1) {
                const enSite = stationsDisponibles.find(s => s.site === sitesFiltrados[0]);
                if (enSite) return enSite;
            }
            if (weatherStationActiva) {
                const sigueAhi = stationsDisponibles.find(s => s.station_id === weatherStationActiva.station_id);
                if (sigueAhi) return sigueAhi;
            }
            return stationsDisponibles[0];
        }

        function renderWeatherWidget() {
            const group  = document.getElementById("weather-group");
            const select = document.getElementById("weather-select");

            // Sin estaciones visibles → ocultar todo el grupo.
            if (stationsDisponibles.length === 0) {
                group.hidden = true;
                weatherStationActiva = null;
                detenerPollingWeather();
                return;
            }
            group.hidden = false;

            // Selector solo si hay más de una estación visible.
            if (stationsDisponibles.length > 1) {
                select.hidden = false;
                select.innerHTML = "";
                for (const st of stationsDisponibles) {
                    const opt = document.createElement("option");
                    opt.value = String(st.station_id);
                    opt.textContent = `${st.display} · ${st.site_display}`;
                    select.appendChild(opt);
                }
            } else {
                select.hidden = true;
            }

            const elegida = elegirStationAuto();
            if (!elegida) return;

            const cambioStation = !weatherStationActiva ||
                                  weatherStationActiva.station_id !== elegida.station_id;
            weatherStationActiva = elegida;
            if (select && !select.hidden) select.value = String(elegida.station_id);

            if (cambioStation) {
                pintarWidgetLoading();
                weatherUltimoFetch = null;
                refrescarWeather();             // arranca polling
            }
        }

        function pintarWidgetLoading() {
            const w = document.getElementById("weather-widget");
            w.className = "weather-widget loading";
            w.querySelector(".weather-icon").textContent = "○";
            w.querySelector(".weather-site").textContent = weatherStationActiva
                ? weatherStationActiva.site_display
                : "—";
            w.querySelector(".weather-metric").textContent = "Cargando…";
        }

        function pintarWidget(data) {
            const w = document.getElementById("weather-widget");
            const sem = data.semaforo;
            w.className = "weather-widget " + sem;

            const icono = sem === "danger" ? "⚠" : sem === "warn" ? "!" : "✓";
            w.querySelector(".weather-icon").textContent = icono;
            w.querySelector(".weather-site").textContent = data.station.site_display;

            const obs = data.observation;
            const viento = obs.wind_avg != null ? `${obs.wind_avg.toFixed(1)} m/s` : "— m/s";
            const rafaga = obs.wind_gust != null ? ` · ráfaga ${obs.wind_gust.toFixed(1)}` : "";
            w.querySelector(".weather-metric").innerHTML =
                `<strong>${viento}</strong>${rafaga}`;
            w.title = `Click para ver detalle · ${data.station.display}`;
        }

        function pintarWidgetError(msg) {
            const w = document.getElementById("weather-widget");
            w.className = "weather-widget error";
            w.querySelector(".weather-icon").textContent = "✕";
            w.querySelector(".weather-site").textContent = weatherStationActiva
                ? weatherStationActiva.site_display
                : "Clima";
            w.querySelector(".weather-metric").textContent = msg || "Sin datos";
        }

        function calcularSemaforo(obs, limits) {
            const L = { ...WEATHER_DEFAULT_LIMITS, ...(limits || {}) };
            const motivos = [];
            let nivel = "ok";
            function escalar(a, b) {
                const orden = { ok: 0, warn: 1, danger: 2 };
                return orden[a] >= orden[b] ? a : b;
            }

            const wa = obs.wind_avg, wg = obs.wind_gust, pr = obs.precip_accum_last_1hr;
            const ldist = obs.lightning_strike_last_distance;
            const lcount = obs.lightning_strike_count_last_3hr;

            if (wa != null && wa > L.wind_avg_danger) {
                nivel = escalar(nivel, "danger");
                motivos.push(`Viento promedio ${wa.toFixed(1)} m/s supera el límite (${L.wind_avg_danger})`);
            } else if (wa != null && wa > L.wind_avg_warn) {
                nivel = escalar(nivel, "warn");
                motivos.push(`Viento promedio ${wa.toFixed(1)} m/s cerca del límite (${L.wind_avg_warn})`);
            }
            if (wg != null && wg > L.wind_gust_danger) {
                nivel = escalar(nivel, "danger");
                motivos.push(`Ráfaga ${wg.toFixed(1)} m/s supera el límite (${L.wind_gust_danger})`);
            } else if (wg != null && wg > L.wind_gust_warn) {
                nivel = escalar(nivel, "warn");
                motivos.push(`Ráfaga ${wg.toFixed(1)} m/s cerca del límite (${L.wind_gust_warn})`);
            }
            if (lcount != null && lcount > 0 && ldist != null) {
                if (ldist < L.lightning_danger_km) {
                    nivel = escalar(nivel, "danger");
                    motivos.push(`Rayos cercanos: último a ${ldist} km`);
                } else if (ldist < L.lightning_warn_km) {
                    nivel = escalar(nivel, "warn");
                    motivos.push(`Rayos en la zona: último a ${ldist} km`);
                }
            }
            if (pr != null && pr > 0) {
                nivel = escalar(nivel, "warn");
                motivos.push(`Precipitación última hora: ${pr.toFixed(1)} mm`);
            }
            return { nivel, motivos };
        }

        async function refrescarWeather() {
            detenerPollingWeather();
            if (!weatherStationActiva) return;
            const idActual = weatherStationActiva.station_id;
            try {
                const r = await fetch(`/center-auth/weather/${idActual}`, { credentials: "same-origin" });
                if (r.status === 401) { mostrarLogin("Sesión expirada."); return; }
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const payload = await r.json();
                // Si el usuario cambió la estación mientras estábamos consultando, ignorar.
                if (!weatherStationActiva || weatherStationActiva.station_id !== idActual) return;
                const { nivel, motivos } = calcularSemaforo(payload.observation, payload.station.limits);
                weatherUltimoFetch = { ...payload, semaforo: nivel, motivos, ts: Date.now() };
                pintarWidget(weatherUltimoFetch);
            } catch (err) {
                console.warn("weather: fallo refrescando", err);
                pintarWidgetError("Sin datos");
            } finally {
                if (weatherStationActiva && weatherStationActiva.station_id === idActual) {
                    weatherPollTimer = setTimeout(refrescarWeather, WEATHER_POLL_MS);
                }
            }
        }

        function detenerPollingWeather() {
            if (weatherPollTimer) { clearTimeout(weatherPollTimer); weatherPollTimer = null; }
        }

        function limpiarWeatherDelUsuario() {
            detenerPollingWeather();
            stationsDisponibles.length = 0;
            weatherStationActiva = null;
            weatherUltimoFetch = null;
            const group = document.getElementById("weather-group");
            if (group) group.hidden = true;
            const sel = document.getElementById("weather-select");
            if (sel) { sel.innerHTML = ""; sel.hidden = true; }
        }

        // Cambio manual de estación desde el <select>.
        document.getElementById("weather-select").addEventListener("change", (ev) => {
            const id = parseInt(ev.target.value, 10);
            const nueva = stationsDisponibles.find(s => s.station_id === id);
            if (!nueva) return;
            weatherStationActiva = nueva;
            weatherUltimoFetch = null;
            pintarWidgetLoading();
            refrescarWeather();
        });

        // Click en el widget → abrir modal con detalle.
        document.getElementById("weather-widget").addEventListener("click", () => abrirModalWeather());

        function abrirModalWeather() {
            if (!weatherStationActiva) return;
            renderModalWeather();
            const ov = document.getElementById("weather-modal-overlay");
            ov.classList.add("open");
            ov.setAttribute("aria-hidden", "false");
        }
        function cerrarModalWeather() {
            const ov = document.getElementById("weather-modal-overlay");
            ov.classList.remove("open");
            ov.setAttribute("aria-hidden", "true");
        }
        document.getElementById("weather-modal-overlay").addEventListener("click", (ev) => {
            if (ev.target === ev.currentTarget) cerrarModalWeather();
        });
        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape") {
                const ov = document.getElementById("weather-modal-overlay");
                if (ov.classList.contains("open")) cerrarModalWeather();
            }
        });

        function renderModalWeather() {
            const cont = document.getElementById("weather-modal");
            const data = weatherUltimoFetch;
            if (!data) {
                cont.innerHTML = `<h2>${weatherStationActiva.display}</h2>
                                  <p class="weather-modal-sub">Cargando datos…</p>
                                  <div class="weather-modal-footer">
                                    <span>—</span>
                                    <button class="weather-modal-close" data-action="close">Cerrar</button>
                                  </div>`;
            } else {
                const obs = data.observation;
                const fmt = (v, unit, dec = 1) => v == null ? "—" : `${Number(v).toFixed(dec)}<small>${unit}</small>`;
                const nivelLabel = data.semaforo === "ok"    ? "OK para volar"
                                 : data.semaforo === "warn"  ? "Precaución"
                                 : "No volar";
                const ageSec = obs.station_observed_at ? (Math.floor(Date.now()/1000) - obs.station_observed_at) : null;
                const ageTxt = ageSec == null ? "—"
                             : ageSec < 60 ? `hace ${ageSec}s`
                             : ageSec < 3600 ? `hace ${Math.floor(ageSec/60)}m`
                             : `hace ${Math.floor(ageSec/3600)}h`;
                cont.innerHTML = `
                    <h2>${data.station.display}</h2>
                    <div class="weather-modal-sub">${data.station.empresa} · ${data.station.site_display}</div>
                    <span class="weather-modal-status ${data.semaforo}">${nivelLabel}</span>

                    <div class="weather-grid">
                        <div class="weather-card ${cardClass(data, 'wind_avg')}">
                            <div class="label">Viento promedio</div>
                            <div class="value">${fmt(obs.wind_avg, " m/s")}</div>
                        </div>
                        <div class="weather-card ${cardClass(data, 'wind_gust')}">
                            <div class="label">Ráfaga máxima</div>
                            <div class="value">${fmt(obs.wind_gust, " m/s")}</div>
                        </div>
                        <div class="weather-card">
                            <div class="label">Dirección</div>
                            <div class="value">${obs.wind_direction != null ? Math.round(obs.wind_direction) + "<small>°</small>" : "—"}</div>
                        </div>
                        <div class="weather-card ${cardClass(data, 'precip')}">
                            <div class="label">Lluvia última hora</div>
                            <div class="value">${fmt(obs.precip_accum_last_1hr, " mm", 2)}</div>
                        </div>
                        <div class="weather-card">
                            <div class="label">Temperatura</div>
                            <div class="value">${fmt(obs.air_temperature, " °C")}</div>
                        </div>
                        <div class="weather-card">
                            <div class="label">Humedad</div>
                            <div class="value">${fmt(obs.relative_humidity, " %", 0)}</div>
                        </div>
                        <div class="weather-card ${cardClass(data, 'lightning')}">
                            <div class="label">Rayos (3h)</div>
                            <div class="value">${obs.lightning_strike_count_last_3hr ?? 0}${obs.lightning_strike_last_distance != null ? `<small>· últ. ${obs.lightning_strike_last_distance} km</small>` : ""}</div>
                        </div>
                        <div class="weather-card">
                            <div class="label">UV / Solar</div>
                            <div class="value">${obs.uv != null ? Math.round(obs.uv) : "—"}<small>${obs.solar_radiation != null ? " · " + Math.round(obs.solar_radiation) + " W/m²" : ""}</small></div>
                        </div>
                    </div>

                    ${data.motivos.length > 0 ? `
                        <div class="weather-reasons ${data.semaforo}">
                            <strong>Motivos:</strong>
                            <ul>${data.motivos.map(m => `<li>${m}</li>`).join("")}</ul>
                        </div>` : ""}

                    <div class="weather-modal-footer">
                        <span>Última medición: ${ageTxt}</span>
                        <button class="weather-modal-close" data-action="close">Cerrar</button>
                    </div>
                `;
            }
            cont.querySelector('[data-action="close"]').addEventListener("click", cerrarModalWeather);
        }

        function cardClass(data, key) {
            // Resalta cards que están contribuyendo al estado warn/danger.
            const obs = data.observation;
            const L = { ...WEATHER_DEFAULT_LIMITS, ...(data.station.limits || {}) };
            if (key === "wind_avg" && obs.wind_avg != null) {
                if (obs.wind_avg > L.wind_avg_danger) return "danger";
                if (obs.wind_avg > L.wind_avg_warn)   return "warn";
            }
            if (key === "wind_gust" && obs.wind_gust != null) {
                if (obs.wind_gust > L.wind_gust_danger) return "danger";
                if (obs.wind_gust > L.wind_gust_warn)   return "warn";
            }
            if (key === "lightning" && obs.lightning_strike_count_last_3hr > 0 && obs.lightning_strike_last_distance != null) {
                if (obs.lightning_strike_last_distance < L.lightning_danger_km) return "danger";
                if (obs.lightning_strike_last_distance < L.lightning_warn_km)   return "warn";
            }
            if (key === "precip" && obs.precip_accum_last_1hr > 0) return "warn";
            return "";
        }

        // Cuando cambia el filtro de sitios, reevaluar qué estación mostrar.
        // Wrappemos aplicarFiltros para no tocarla directamente.
        const _aplicarFiltrosOriginal = aplicarFiltros;
        aplicarFiltros = function() {
            _aplicarFiltrosOriginal();
            renderWeatherWidget();
        };

        iniciarApp();

        window.addEventListener("beforeunload", () => { cerrarTodo(); detenerPollingWeather(); });
    </script>

    <!-- Modal de detalle del weather (renderizado dinámicamente por el JS) -->
    <div class="weather-modal-overlay" id="weather-modal-overlay" aria-hidden="true">
        <div class="weather-modal" id="weather-modal" role="dialog" aria-modal="true"></div>
    </div>
</body>
</html>
