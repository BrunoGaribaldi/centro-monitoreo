<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro de Monitoreo · NQN Petrol</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta inspirada en el logo NQN Petrol */
            --color-bg:           #f4f6f9;
            --color-surface:      #ffffff;
            --color-surface-alt:  #eef1f5;
            --color-border:       #d8dee7;
            --color-border-soft:  #e7ebf1;
            --color-text:         #1a2238;
            --color-text-muted:   #6b7488;
            --color-text-soft:    #8a93a6;

            --color-primary:      #0b3a78;   /* azul oscuro del "NQN" */
            --color-primary-hover:#0e4a99;
            --color-accent:       #ff6b1f;   /* naranja del símbolo */
            --color-live:         #16a34a;   /* verde "en vivo" */
            --color-error:        #dc2626;

            --shadow-sm:  0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md:  0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-lg:  0 4px 16px rgba(15, 23, 42, 0.08);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;

            --topbar-h: 64px;
        }

        * { box-sizing: border-box; }

        /* El atributo HTML `hidden` debería ocultar un elemento, pero los
           selectores con `display: flex/grid` lo pisan por especificidad.
           Esta regla restaura el comportamiento estándar de HTML5. */
        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ===== Login overlay ===== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .login-overlay.visible { display: flex; }
        body.locked { overflow: hidden; }

        .login-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--color-border-soft);
        }
        .login-brand img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .login-brand-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.2;
        }
        .login-brand-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 3px;
        }
        .login-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text);
            margin: 0 0 4px 0;
        }
        .login-subheading {
            font-size: 12px;
            color: var(--color-text-muted);
            margin: 0 0 24px 0;
        }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .login-field input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            color: var(--color-text);
            background: var(--color-surface);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-field input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 58, 120, 0.10);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }
        .login-btn:hover    { background: var(--color-primary-hover); }
        .login-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .login-error {
            margin-top: 14px;
            padding: 10px 12px;
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.25);
            border-radius: var(--radius-sm);
            color: var(--color-error);
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .login-error.visible { display: block; }
        .login-footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--color-border-soft);
            text-align: center;
            font-size: 12px;
            color: var(--color-text-muted);
        }
        .login-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover { text-decoration: underline; }

        .login-powered {
            margin-top: 14px;
            text-align: center;
            font-size: 10px;
            font-weight: 500;
            color: var(--color-text-soft);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .login-powered a {
            color: var(--color-text-soft);
            text-decoration: none;
            border-bottom: 1px dotted var(--color-border);
            padding-bottom: 1px;
        }
        .login-powered a:hover { color: var(--color-primary); }

        @media (max-width: 480px) {
            .login-card { padding: 28px 22px; }
        }

        /* ===== Topbar ===== */
        .topbar {
            height: var(--topbar-h);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 24px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .brand img {
            height: 36px;
            object-fit: contain;
            display: block;
        }

        .brand-divider {
            width: 1px;
            height: 28px;
            background: var(--color-border);
        }

        .brand-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.2;
            white-space: nowrap;
        }
        .brand-subtitle {
            font-size: 11px;
            font-weight: 500;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 2px;
        }

        /* ===== Toolbar (filtros + sizer + pager) ===== */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            padding-right: 8px;
        }
        .toolbar::-webkit-scrollbar { height: 4px; }
        .toolbar::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .toolbar-group-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-text-soft);
        }

        /* ----- Filtros (dropdowns con checkboxes) ----- */
        .filter-dropdown {
            position: relative;
            display: inline-block;
        }
        .filter-trigger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px 7px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            color: var(--color-text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
            white-space: nowrap;
        }
        .filter-trigger:hover { border-color: var(--color-primary); }
        .filter-trigger.is-default { color: var(--color-text-muted); font-weight: 400; }
        .filter-trigger.is-open {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 58, 120, 0.10);
        }
        .filter-trigger .chevron {
            width: 14px;
            height: 14px;
            transition: transform 0.15s ease;
            flex-shrink: 0;
            opacity: 0.65;
        }
        .filter-trigger.is-open .chevron { transform: rotate(180deg); }

        .filter-panel {
            /* fixed para que se superponga sobre cualquier contenedor con
               overflow (la toolbar tiene overflow-x: auto). Las coordenadas
               (top/left) las setea el JS según getBoundingClientRect del trigger. */
            position: fixed;
            min-width: 220px;
            max-width: 360px;
            max-height: 60vh;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .filter-panel.open { display: flex; }
        .filter-panel-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
            scrollbar-width: thin;
        }
        .filter-panel-list::-webkit-scrollbar { width: 6px; }
        .filter-panel-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--color-text);
            transition: background 0.1s;
        }
        .filter-option:hover { background: var(--color-surface-alt); }
        .filter-option input[type=checkbox] {
            margin: 0;
            cursor: pointer;
            accent-color: var(--color-primary);
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        .filter-empty {
            padding: 14px;
            font-size: 12px;
            color: var(--color-text-muted);
            text-align: center;
        }
        .filter-footer {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-top: 1px solid var(--color-border-soft);
            background: var(--color-surface-alt);
        }
        .filter-footer button {
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            font-family: inherit;
            border-radius: 4px;
        }
        .filter-footer button:hover {
            color: var(--color-primary);
            background: var(--color-surface);
        }

        /* ----- Selector de tamaño de grid ----- */
        .grid-sizer {
            display: inline-flex;
            background: var(--color-surface-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 3px;
            gap: 2px;
        }
        .size-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 30px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .size-btn:hover {
            background: var(--color-surface);
            color: var(--color-text);
        }
        .size-btn.active {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.15);
        }
        .grid-icon {
            display: grid;
            grid-template-columns: repeat(var(--icon-cols, 2), 1fr);
            gap: 1.5px;
            width: 16px;
            height: 16px;
        }
        .grid-icon span {
            background: currentColor;
            border-radius: 1px;
            min-width: 0;
            min-height: 0;
        }
        .grid-icon.single span {
            border-radius: 2px;
        }

        /* ----- Toggle de ajuste de video (cover / contain) ----- */
        .fit-toggle {
            display: inline-flex;
            background: var(--color-surface-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 3px;
            gap: 2px;
        }
        .fit-btn {
            padding: 5px 11px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--color-text-muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .fit-btn:hover {
            background: var(--color-surface);
            color: var(--color-text);
        }
        .fit-btn.active {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.15);
        }

        /* ----- Paginación ----- */
        .pager {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pager-info {
            font-size: 12px;
            color: var(--color-text-muted);
            white-space: nowrap;
            min-width: 70px;
            text-align: center;
        }
        .pager-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            color: var(--color-text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
        }
        .pager-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        .pager-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ----- Weather widget ----- */
        .weather-widget {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 10px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-left-width: 3px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
            white-space: nowrap;
            font-family: inherit;
            color: var(--color-text);
        }
        .weather-widget:hover {
            box-shadow: var(--shadow-sm);
        }
        .weather-widget.ok    { border-left-color: var(--color-live); }
        .weather-widget.warn  { border-left-color: #f59e0b; }
        .weather-widget.danger{ border-left-color: var(--color-error); }
        .weather-widget.loading { color: var(--color-text-muted); border-left-color: var(--color-border); }
        .weather-widget.error   { color: var(--color-error); border-left-color: var(--color-error); }
        .weather-icon {
            font-size: 16px;
            line-height: 1;
        }
        .weather-widget.ok    .weather-icon { color: var(--color-live); }
        .weather-widget.warn  .weather-icon { color: #f59e0b; }
        .weather-widget.danger .weather-icon { color: var(--color-error); }
        .weather-site {
            font-weight: 600;
            color: var(--color-text);
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .weather-metric {
            color: var(--color-text-muted);
            font-weight: 500;
        }
        .weather-metric strong {
            color: var(--color-text);
            font-weight: 600;
        }
        .weather-select {
            margin-left: 4px;
            padding: 4px 6px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            background: var(--color-surface);
            font-family: inherit;
            font-size: 11px;
            color: var(--color-text);
            cursor: pointer;
        }

        /* ----- Modal expandible del weather ----- */
        .weather-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }
        .weather-modal-overlay.open { display: flex; }
        .weather-modal {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 24px 28px 22px;
        }
        .weather-modal h2 {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 700;
            color: var(--color-text);
        }
        .weather-modal-sub {
            color: var(--color-text-muted);
            font-size: 12px;
            margin-bottom: 4px;
        }
        .weather-modal-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 12px 0 18px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .weather-modal-status.ok    { background: rgba(22, 163, 74, 0.12); color: var(--color-live); }
        .weather-modal-status.warn  { background: rgba(245, 158, 11, 0.14); color: #b45309; }
        .weather-modal-status.danger{ background: rgba(220, 38, 38, 0.12); color: var(--color-error); }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }
        .weather-card {
            border: 1px solid var(--color-border-soft);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            background: var(--color-surface-alt);
        }
        .weather-card .label {
            font-size: 10px;
            font-weight: 600;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 4px;
        }
        .weather-card .value {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text);
        }
        .weather-card .value small {
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-muted);
            margin-left: 4px;
        }
        .weather-card.warn  { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.08); }
        .weather-card.danger{ border-color: rgba(220, 38, 38, 0.4); background: rgba(220, 38, 38, 0.08); }

        .weather-reasons {
            margin: 0 0 18px;
            padding: 10px 12px;
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid #f59e0b;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            color: var(--color-text);
        }
        .weather-reasons.danger {
            background: rgba(220, 38, 38, 0.08);
            border-left-color: var(--color-error);
        }
        .weather-reasons ul { margin: 4px 0 0; padding-left: 18px; }
        .weather-reasons li { margin: 2px 0; }

        .weather-modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--color-border-soft);
            padding-top: 14px;
            font-size: 11.5px;
            color: var(--color-text-muted);
        }
        .weather-modal-close {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 7px 16px;
            font-size: 12.5px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .weather-modal-close:hover { background: var(--color-primary-hover); }

        /* ----- Acciones (logout) ----- */
        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            padding-left: 12px;
            border-left: 1px solid var(--color-border);
        }
        .actions button {
            padding: 8px 14px;
            background: var(--color-surface);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .actions button:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-surface-alt);
        }
        .logout-btn:hover {
            border-color: var(--color-error) !important;
            color: var(--color-error) !important;
        }

        /* ===== Grid ===== */
        .grid {
            flex: 1;
            display: grid;
            gap: 12px;
            padding: 16px;
            overflow: hidden;
            grid-template-columns: repeat(var(--cols, 1), 1fr);
            grid-auto-rows: 1fr;
        }
        .grid.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .empty-state {
            max-width: 360px;
            text-align: center;
            color: var(--color-text-muted);
        }
        .empty-state .icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.4;
        }
        .empty-state h3 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text);
        }
        .empty-state p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .camara {
            background: #0a0a0a;
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            min-width: 0;
            min-height: 0;
            box-shadow: var(--shadow-md);
        }

        /* Slot vacío (cuando hay menos cámaras que slots elegidos) */
        .celda-vacia {
            background: var(--color-surface-alt);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            color: var(--color-text-soft);
            font-size: 12px;
        }
        .celda-vacia .icono {
            font-size: 22px;
            opacity: 0.4;
            margin-bottom: 4px;
        }
        .celda-vacia .texto {
            text-align: center;
            line-height: 1.3;
        }
        .celda-vacia-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            opacity: 0.7;
        }

        .camara video {
            width: 100%;
            height: 100%;
            /* --video-fit lo setea el toggle "Ajustar / Llenar" de la toolbar.
               cover = llena el slot recortando los bordes que sobran (sin distorsión).
               contain = muestra la imagen completa con letterbox (barras negras). */
            object-fit: var(--video-fit, cover);
            display: block;
            background: #000;
        }

        .titulo-cam {
            position: absolute;
            top: 12px;
            left: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
            z-index: 10;
            pointer-events: none;
        }
        .titulo-cam .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-text-soft);
            transition: background 0.2s;
        }
        .titulo-cam.live .live-dot {
            background: var(--color-live);
            box-shadow: 0 0 8px rgba(22, 163, 74, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        .titulo-cam.error .live-dot {
            background: var(--color-error);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }

        .estado {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #c8cdd6;
            font-size: 13px;
            pointer-events: none;
            background: rgba(10, 10, 10, 0.4);
        }
        .estado.hidden { display: none; }
        .estado.error { color: #f0a8a8; }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* =====================================================================
           RESPONSIVE
           Breakpoints:
             > 1024px  desktop  (default — todo entra en una fila horizontal)
             720–1024  tablet   (gap más chico, sigue todo en una fila)
             480–720   mobile   (toolbar wrap a 2 filas, ocultar tamaños 16/25)
             < 480px   small    (ocultar también tamaño 3, paddings mínimos)
           ===================================================================== */

        @media (max-width: 1024px) {
            .toolbar { gap: 14px; }
            .toolbar-group { gap: 6px; }
            .topbar { padding: 0 16px; gap: 16px; }
        }

        @media (max-width: 720px) {
            /* La topbar se vuelve flex-wrap: la brand + actions quedan arriba,
               la toolbar baja a una segunda fila ocupando el 100%. */
            .topbar {
                padding: 10px 14px;
                gap: 12px;
                height: auto;
                min-height: var(--topbar-h);
                flex-wrap: wrap;
                align-items: center;
                box-shadow: var(--shadow-sm);
            }
            .brand-divider, .brand-title-wrap { display: none; }
            .brand { flex: 1; min-width: 0; }

            .toolbar {
                order: 99;             /* abajo de la fila brand+actions */
                flex-basis: 100%;
                gap: 12px;
                padding: 10px 0 0;
                margin-top: 2px;
                border-top: 1px solid var(--color-border-soft);
            }
            .actions { padding-left: 0; border-left: none; }

            .toolbar-group-title { font-size: 9px; letter-spacing: 0.5px; }
            .filter-trigger { padding: 6px 10px; font-size: 12px; }

            /* Iconos del sizer un poco más chicos */
            .size-btn { width: 32px; height: 28px; }
            .grid-icon { width: 14px; height: 14px; }

            /* Tamaños 16 y 25 no tienen sentido en mobile (celdas ilegibles) */
            .size-btn[data-size="16"],
            .size-btn[data-size="25"] { display: none; }

            .fit-btn { padding: 4px 9px; font-size: 11px; }

            .grid { padding: 8px; gap: 8px; }
            .titulo-cam { font-size: 11px; padding: 4px 8px; }

            /* El panel del filtro nunca debe salirse del viewport */
            .filter-panel {
                max-width: calc(100vw - 16px);
                min-width: min(220px, calc(100vw - 16px));
                max-height: 50vh;
            }
        }

        @media (max-width: 480px) {
            .login-card { padding: 28px 22px; }

            .topbar { padding: 8px 12px; gap: 10px; }
            .toolbar { gap: 10px; }
            .toolbar-group { gap: 4px; }

            .size-btn { width: 30px; height: 26px; }
            .grid-icon { width: 13px; height: 13px; }

            .filter-trigger { padding: 5px 9px; font-size: 11.5px; }
            .fit-btn { padding: 4px 8px; font-size: 10.5px; }

            .grid { padding: 6px; gap: 6px; }
            .titulo-cam { top: 8px; left: 8px; padding: 3px 7px; }
            .celda-vacia .icono { font-size: 18px; }
            .celda-vacia .texto { font-size: 11px; }

            /* Login powered footer un poco más chico */
            .login-powered { font-size: 9px; letter-spacing: 0.8px; }
        }
    </style>
</head>
<body>

    <!-- Overlay de login (visible solo si /center-auth/cameras devuelve 401).
         Por debajo postea a /authelia/api/firstfactor; la cookie de sesión
         queda seteada por Authelia y el dashboard puede consumir la API. -->
    <div class="login-overlay" id="login-overlay" aria-hidden="true">
        <form class="login-card" id="login-form" autocomplete="on">
            <div class="login-brand">
                <img src="images.png" alt="NQN Petrol">
                <div>
                    <div class="login-brand-title">Centro de Monitoreo</div>
                    <div class="login-brand-sub">Streaming en vivo</div>
                </div>
            </div>

            <h2 class="login-heading">Ingresar</h2>
            <p class="login-subheading">Usá tu usuario y contraseña asignados.</p>

            <div class="login-field">
                <label for="login-username">Usuario</label>
                <input type="text" id="login-username" name="username"
                       autocomplete="username" autocapitalize="none"
                       spellcheck="false" required>
            </div>
            <div class="login-field">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-btn" id="login-btn">Ingresar</button>
            <div class="login-error" id="login-error" role="alert"></div>

            <div class="login-footer">
                ¿Olvidaste tu contraseña? Avisale al administrador.
            </div>
            <div class="login-powered">
                Powered by <a href="https://www.authelia.com" target="_blank" rel="noopener">Authelia</a>
            </div>
        </form>
    </div>

    <header class="topbar">
        <div class="brand">
            <img id="brand-logo" src="images.png" alt="NQN Petrol">
            <div class="brand-divider"></div>
            <div class="brand-title-wrap">
                <div class="brand-title">Centro de Monitoreo</div>
                <div class="brand-subtitle" id="brand-subtitle">Streaming en vivo</div>
            </div>
        </div>

        <div class="toolbar" id="toolbar">
            <!-- Weather widget: visible solo si el user tiene alguna estación.
                 El JS lo rellena tras /center-auth/weather/stations. -->
            <div class="toolbar-group" id="weather-group" hidden>
                <span class="toolbar-group-title">Clima · Estación Meteo. Tempest</span>
                <button type="button" class="weather-widget loading" id="weather-widget" title="Ver detalle">
                    <span class="weather-icon">○</span>
                    <span class="weather-site">—</span>
                    <span class="weather-metric">Cargando…</span>
                </button>
                <select class="weather-select" id="weather-select" hidden></select>
            </div>

            <!-- Filtros drill-down: el contenido depende del rol del user. -->
            <div class="toolbar-group" id="filters"></div>

            <!-- Selector de tamaño de cuadrícula (1, 2, 3, 4, 9, 16, 25). -->
            <div class="toolbar-group">
                <span class="toolbar-group-title">Cuadrícula</span>
                <div class="grid-sizer" id="grid-sizer">
                    <button type="button" class="size-btn" data-size="1" title="1 cámara">
                        <span class="grid-icon single" style="--icon-cols:1"><span></span></span>
                    </button>
                    <button type="button" class="size-btn" data-size="2" title="2 cámaras">
                        <span class="grid-icon" style="--icon-cols:2">
                            <span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="3" title="3 cámaras">
                        <span class="grid-icon" style="--icon-cols:3">
                            <span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="4" title="2 × 2 = 4 cámaras">
                        <span class="grid-icon" style="--icon-cols:2">
                            <span></span><span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="9" title="3 × 3 = 9 cámaras">
                        <span class="grid-icon" style="--icon-cols:3">
                            <span></span><span></span><span></span>
                            <span></span><span></span><span></span>
                            <span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="16" title="4 × 4 = 16 cámaras">
                        <span class="grid-icon" style="--icon-cols:4">
                            <span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span>
                        </span>
                    </button>
                    <button type="button" class="size-btn" data-size="25" title="5 × 5 = 25 cámaras">
                        <span class="grid-icon" style="--icon-cols:5">
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                        </span>
                    </button>
                </div>
            </div>

            <!-- Toggle de ajuste de video (sin distorsionar la imagen). -->
            <div class="toolbar-group">
                <span class="toolbar-group-title">Ajuste</span>
                <div class="fit-toggle" id="fit-toggle">
                    <button type="button" class="fit-btn" data-fit="cover"
                            title="Llenar el reproductor (recorta bordes si sobran)">Llenar</button>
                    <button type="button" class="fit-btn" data-fit="contain"
                            title="Ajustar al reproductor (muestra imagen completa con bordes)">Ajustar</button>
                </div>
            </div>

            <!-- Paginación (visible solo si hay más cámaras filtradas que slots). -->
            <div class="toolbar-group pager" id="pager" hidden>
                <button type="button" class="pager-btn" id="pager-prev" title="Página anterior">‹</button>
                <span class="pager-info" id="pager-info">1 / 1</span>
                <button type="button" class="pager-btn" id="pager-next" title="Página siguiente">›</button>
            </div>
        </div>

        <div class="actions">
            <button class="logout-btn" id="btn-logout" title="Cerrar sesión">Salir</button>
        </div>
    </header>

    <main class="grid" id="grid"></main>

    <script>
        // ==================================================================
        // Autenticación
        // ==================================================================
        // Authelia maneja la sesión vía cookie HttpOnly. El login lo hace
        // el overlay de esta misma página posteando a /authelia/api/firstfactor;
        // si el user activó 2FA, redirigimos al portal solo en ese caso.
        const API_CAMERAS    = "/center-auth/cameras";
        const API_FIRSTFACTOR = "/authelia/api/firstfactor";
        const PORTAL_AUTHELIA = "/authelia/";

        function mostrarLogin(msg) {
            cerrarTodo();
            const overlay = document.getElementById("login-overlay");
            const errEl   = document.getElementById("login-error");
            overlay.classList.add("visible");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("locked");
            if (msg) {
                errEl.textContent = msg;
                errEl.classList.add("visible");
            } else {
                errEl.textContent = "";
                errEl.classList.remove("visible");
            }
            setTimeout(() => document.getElementById("login-username").focus(), 50);
        }
        function ocultarLogin() {
            const overlay = document.getElementById("login-overlay");
            overlay.classList.remove("visible");
            overlay.setAttribute("aria-hidden", "true");
            document.body.classList.remove("locked");
            document.getElementById("login-error").classList.remove("visible");
        }

        // ==================================================================
        // Configuración de cámaras (dinámica — cargada desde /center-auth/cameras)
        // ==================================================================
        // CAMARAS es la lista plana. JERARQUIA agrupa por empresa → site → cameras
        // para alimentar los dropdowns drill-down de la toolbar.
        const CAMARAS = [];
        let   JERARQUIA = {};          // { empresaId: { display, sites: { siteId: { display, cameras: [...] } } } }
        let   ROL_USER = null;         // "superadmin" | "admin_empresa" | "admin_site" | "viewer_drone"
        let   EMPRESA_USER = null;     // ID de empresa del user (null para superadmin)

        const RETRY_MS       = 4000;
        const ICE_TIMEOUT_MS = 4000;

        // ---- Logos por empresa ----
        // El login muestra siempre el logo de NQN Petrol (no conocemos la
        // empresa hasta después del login). El dashboard cambia el logo del
        // topbar según la empresa del user logueado.
        const LOGO_DEFAULT = "images.png";       // NQN Petrol (superadmin / fallback)
        const LOGOS_EMPRESA = {
            QUINTANA: "Qnt_Logo.png",
            SEI:      "sei.png",
        };
        const LOGO_ALTURA = {
            SEI: "52px",
        };

        function aplicarLogoEmpresa(rol, empresaId) {
            const img = document.getElementById("brand-logo");
            if (!img) return;
            // Superadmin (sin empresa) o empresa desconocida → logo default.
            const archivo = (rol === "superadmin" || !empresaId)
                ? LOGO_DEFAULT
                : (LOGOS_EMPRESA[empresaId] || LOGO_DEFAULT);
            const empresaDisplay = empresaId && JERARQUIA[empresaId]
                ? JERARQUIA[empresaId].display
                : "NQN Petrol";
            img.src = archivo;
            img.alt = empresaDisplay;
            img.style.height = (empresaId && LOGO_ALTURA[empresaId]) || "";
        }

        // ---- Estado de UI (filtros + tamaño de grid + página + fit mode) ----
        const STORAGE_FILTROS = "centro-monitoreo:filtros";
        const STORAGE_SIZE    = "centro-monitoreo:gridSize";
        const STORAGE_FIT     = "centro-monitoreo:fitMode";
        const TAMANOS_VALIDOS = [1, 2, 3, 4, 9, 16, 25];
        const COLS_POR_TAMANO = { 1: 1, 2: 2, 3: 3, 4: 2, 9: 3, 16: 4, 25: 5 };
        const TAMANO_DEFAULT  = 9;
        const FITS_VALIDOS    = ["cover", "contain"];
        const FIT_DEFAULT     = "cover";

        // Multi-select: cada filtro es un Set. Set vacío = "todos los items".
        let filtros = { empresas: new Set(), sites: new Set(), dispositivos: new Set() };
        let gridSize = TAMANO_DEFAULT;
        let fitMode = FIT_DEFAULT;
        let pagina = 0;
        let panelAbierto = null;   // referencia al .filter-panel actualmente abierto

        function configurarCamaras(data) {
            const sites = (data && data.sites) || [];
            ROL_USER     = (data && data.rol) || null;
            EMPRESA_USER = (data && data.empresa) || null;

            CAMARAS.length = 0;
            JERARQUIA = {};

            for (const site of sites) {
                // Para superadmin, site.empresa viene con el display name de la empresa.
                // Para los demás roles no viene → usamos EMPRESA_USER como id y display.
                const empresaId   = site.empresa ? site.empresa : (EMPRESA_USER || "—");
                const empresaShow = site.empresa || EMPRESA_USER || "—";

                if (!JERARQUIA[empresaId]) {
                    JERARQUIA[empresaId] = { display: empresaShow, sites: {} };
                }
                JERARQUIA[empresaId].sites[site.site] = {
                    display: site.display,
                    cameras: site.cameras,
                };

                for (const cam of site.cameras) {
                    CAMARAS.push({
                        path:        cam.path,
                        titulo:      cam.titulo || cam.path,
                        site:        site.site,
                        siteDisplay: site.display,
                        empresa:     empresaId,
                        empresaShow: empresaShow,
                    });
                }
            }

            cargarPreferenciasUI();
            aplicarLogoEmpresa(ROL_USER, EMPRESA_USER);
        }

        // En mobile (<= 720px) los tamaños 16 y 25 están ocultos en el CSS.
        // Si el user los había seleccionado en desktop y abre en mobile, hay
        // que bajarle el gridSize para que pueda interactuar con la UI.
        function tamanoMaximoParaViewport() {
            return window.innerWidth <= 720 ? 9 : 25;
        }
        function clampGridSizeAlViewport() {
            const max = tamanoMaximoParaViewport();
            if (gridSize > max) {
                gridSize = max;
                pagina = 0;
                guardarPreferenciasUI();
                return true;
            }
            return false;
        }

        function cargarPreferenciasUI() {
            // Tamaño de grid
            try {
                const raw = localStorage.getItem(STORAGE_SIZE);
                const n = parseInt(raw, 10);
                gridSize = TAMANOS_VALIDOS.includes(n) ? n : TAMANO_DEFAULT;
            } catch { gridSize = TAMANO_DEFAULT; }
            clampGridSizeAlViewport();

            // Fit mode (cover / contain)
            try {
                const raw = localStorage.getItem(STORAGE_FIT);
                fitMode = FITS_VALIDOS.includes(raw) ? raw : FIT_DEFAULT;
            } catch { fitMode = FIT_DEFAULT; }
            aplicarFit(fitMode);

            // Filtros: solo conservar los items que existan en la jerarquía
            // actual (defensa contra empresas/sitios borrados del backend).
            filtros = { empresas: new Set(), sites: new Set(), dispositivos: new Set() };
            try {
                const raw = JSON.parse(localStorage.getItem(STORAGE_FILTROS) || "{}");
                const empresasGuardadas = Array.isArray(raw.empresas)     ? raw.empresas     : [];
                const sitesGuardados    = Array.isArray(raw.sites)        ? raw.sites        : [];
                const dispGuardados     = Array.isArray(raw.dispositivos) ? raw.dispositivos : [];

                const sitesValidos = new Set();
                const pathsValidos = new Set();
                for (const [, emp] of Object.entries(JERARQUIA)) {
                    for (const [sid, sdata] of Object.entries(emp.sites)) {
                        sitesValidos.add(sid);
                        for (const cam of sdata.cameras) pathsValidos.add(cam.path);
                    }
                }
                for (const e of empresasGuardadas) if (JERARQUIA[e])    filtros.empresas.add(e);
                for (const s of sitesGuardados)    if (sitesValidos.has(s)) filtros.sites.add(s);
                for (const d of dispGuardados)     if (pathsValidos.has(d)) filtros.dispositivos.add(d);
            } catch {}
            pagina = 0;
        }

        function guardarPreferenciasUI() {
            try { localStorage.setItem(STORAGE_SIZE, String(gridSize)); } catch {}
            try {
                localStorage.setItem(STORAGE_FILTROS, JSON.stringify({
                    empresas:     [...filtros.empresas],
                    sites:        [...filtros.sites],
                    dispositivos: [...filtros.dispositivos],
                }));
            } catch {}
        }

        // ==================================================================
        // Cámaras filtradas + paginación
        // ==================================================================
        // Set vacío en un filtro = "todos los items". Set con N items = AND
        // entre dimensiones, OR dentro de cada dimensión.
        // El filtro "dispositivos" matchea por path literal (cam.path).
        function camarasFiltradas() {
            return CAMARAS.filter(cam => {
                if (filtros.empresas.size     > 0 && !filtros.empresas.has(cam.empresa)) return false;
                if (filtros.sites.size        > 0 && !filtros.sites.has(cam.site))       return false;
                if (filtros.dispositivos.size > 0 && !filtros.dispositivos.has(cam.path)) return false;
                return true;
            });
        }

        function totalPaginas() {
            const total = camarasFiltradas().length;
            return Math.max(1, Math.ceil(total / gridSize));
        }

        function camarasEnPaginaActual() {
            const todas = camarasFiltradas();
            const ini = pagina * gridSize;
            return todas.slice(ini, ini + gridSize);
        }

        async function iniciarApp() {
            try {
                const r = await fetch(API_CAMERAS, { credentials: "same-origin" });
                // 401: sesión inválida/expirada. 403: usuario no tiene acceso.
                // Cualquier 4xx/5xx inesperado (ej. nginx devuelve 500 cuando
                // Authelia retorna 302 por sesión expirada) también va al login,
                // ya que la causa es siempre la sesión.
                if (!r.ok) { mostrarLogin(); return; }
                const data = await r.json();
                ocultarLogin();
                configurarCamaras(data);
                renderToolbar();
                renderGrid();
                // Cargar weather después del login (puede no haber estaciones
                // visibles → el widget queda oculto silenciosamente).
                if (typeof cargarWeatherStations === "function") cargarWeatherStations();
            } catch (err) {
                console.warn("No se pudo cargar /center-auth/cameras:", err);
                mostrarLogin();
            }
        }

        // ==================================================================
        // Form de login → /authelia/api/firstfactor
        // ==================================================================
        // Authelia expone una API que el portal nativo usa por debajo.
        // Posteamos JSON con username/password, Authelia setea la cookie
        // de sesión, y volvemos a llamar a /center-auth/cameras (esta vez
        // con cookie válida) para renderizar el grid sin reload.
        //
        // Si el user tiene 2FA activado, Authelia devuelve un redirect que
        // contiene /2fa/ → en ese caso redirigimos al portal nativo SOLO
        // para esa parte (es una vez en la vida del usuario).
        document.getElementById("login-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const userEl = document.getElementById("login-username");
            const passEl = document.getElementById("login-password");
            const btn    = document.getElementById("login-btn");
            const errEl  = document.getElementById("login-error");

            const username = userEl.value.trim();
            const password = passEl.value;
            if (!username || !password) {
                errEl.textContent = "Ingresá usuario y contraseña.";
                errEl.classList.add("visible");
                return;
            }

            btn.disabled    = true;
            btn.textContent = "Ingresando…";
            errEl.classList.remove("visible");

            try {
                const r = await fetch(API_FIRSTFACTOR, {
                    method:      "POST",
                    credentials: "same-origin",
                    headers:     { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        password,
                        keepMeLoggedIn: false,
                        targetURL:      window.location.href,
                        requestMethod:  "GET",
                    }),
                });

                let data = {};
                try { data = await r.json(); } catch {}

                if (!r.ok || data.status !== "OK") {
                    const msg = (data && data.message) || "Credenciales incorrectas.";
                    errEl.textContent = msg;
                    errEl.classList.add("visible");
                    passEl.value = "";
                    passEl.focus();
                    return;
                }

                // Si Authelia pide pasos adicionales (2FA u otro), redirige al portal.
                // Si el redirect apunta al propio dashboard (misma origin, fuera de /authelia/),
                // lo ignoramos y cargamos la app directamente sin navegar.
                const redirect = data.data && data.data.redirect;
                if (redirect) {
                    try {
                        const url = new URL(redirect, window.location.origin);
                        const esDashboard = url.origin === window.location.origin &&
                                            !url.pathname.startsWith("/authelia");
                        if (!esDashboard) { window.location.href = redirect; return; }
                    } catch {}
                }

                // Login OK y sin 2FA pendiente — cookie ya está seteada.
                passEl.value = "";
                ocultarLogin();
                await iniciarApp();
            } catch (err) {
                console.warn("Error en login:", err);
                errEl.textContent = "Error de red. Probá de nuevo.";
                errEl.classList.add("visible");
            } finally {
                btn.disabled    = false;
                btn.textContent = "Ingresar";
            }
        });

        document.getElementById("btn-logout").addEventListener("click", async () => {
            cerrarTodo();
            // Limpiar estado de weather (polling, cache, widget) si el
            // módulo está cargado.
            if (typeof limpiarWeatherDelUsuario === "function") limpiarWeatherDelUsuario();
            // Llama al endpoint de logout de Authelia para que limpie la cookie,
            // pero sin navegar: el usuario se queda en el dashboard y ve el overlay.
            try { await fetch("/authelia/logout", { credentials: "same-origin" }); } catch {}
            // Volver al logo NQN por si después se loguea otro usuario.
            aplicarLogoEmpresa(null, null);
            mostrarLogin();
        });

        // ==================================================================
        // Compatibilidad
        // ==================================================================
        if (typeof RTCPeerConnection === "undefined") {
            document.body.innerHTML =
                '<div style="padding:40px;font-family:sans-serif;color:#dc2626">' +
                '<h2>Navegador no compatible</h2>' +
                '<p>Este dashboard requiere soporte de WebRTC. Usá Chrome, Edge o Firefox actualizados.</p>' +
                '</div>';
            throw new Error("WebRTC no soportado");
        }

        // ==================================================================
        // Estado de conexiones WebRTC
        // ==================================================================
        // path -> { pc, retryTimer, generation }
        const conexiones = new Map();

        // ==================================================================
        // Toolbar: filtros (drill-down según rol) + sizer + paginación
        // ==================================================================
        function renderToolbar() {
            renderFilters();
            renderGridSizer();
            renderPager();
        }

        function renderFilters() {
            const cont = document.getElementById("filters");
            cont.innerHTML = "";
            panelAbierto = null;   // se invalida cualquier ref a paneles previos

            // viewer_drone no tiene filtros (única cámara).
            if (ROL_USER === "viewer_drone") return;

            // --- Empresas (solo superadmin) ---
            if (ROL_USER === "superadmin") {
                const empresas = Object.keys(JERARQUIA).sort();
                const opciones = empresas.map(e => ({ value: e, label: JERARQUIA[e].display }));
                cont.appendChild(crearFilterDropdown({
                    titulo:   "Empresas",
                    plural:   "empresas",
                    opciones,
                    seleccion: filtros.empresas,
                    onChange: (nuevo) => {
                        filtros.empresas = nuevo;
                        // cascade clear: limpiar sitios/dispositivos que ya no aplican
                        filtros.sites = new Set([...filtros.sites].filter(s => sitioVisible(s)));
                        filtros.dispositivos = new Set([...filtros.dispositivos].filter(d => dispositivoVisible(d)));
                        aplicarFiltros();
                    },
                }));
            }

            // --- Sitios ---
            // Universo de sitios visibles, según empresas seleccionadas (o todas si Set vacío).
            const sitiosOpciones = [];
            for (const [empId, empData] of Object.entries(JERARQUIA)) {
                if (ROL_USER === "superadmin" && filtros.empresas.size > 0 && !filtros.empresas.has(empId)) continue;
                for (const [sid, sdata] of Object.entries(empData.sites)) {
                    sitiosOpciones.push({
                        value: sid,
                        label: sdata.display,
                        sub:   (ROL_USER === "superadmin") ? empData.display : null,
                    });
                }
            }
            sitiosOpciones.sort((a, b) => a.label.localeCompare(b.label, "es"));

            if (sitiosOpciones.length > 1) {
                cont.appendChild(crearFilterDropdown({
                    titulo:   "Sitios",
                    plural:   "sitios",
                    opciones: sitiosOpciones,
                    seleccion: filtros.sites,
                    onChange: (nuevo) => {
                        filtros.sites = nuevo;
                        filtros.dispositivos = new Set([...filtros.dispositivos].filter(d => dispositivoVisible(d)));
                        aplicarFiltros();
                    },
                }));
            }

            // --- Dispositivos (lista cámaras individuales por path/titulo literal) ---
            // Universo de cámaras visibles, según empresas + sitios seleccionados.
            const dispOpciones = [];
            for (const [empId, empData] of Object.entries(JERARQUIA)) {
                if (ROL_USER === "superadmin" && filtros.empresas.size > 0 && !filtros.empresas.has(empId)) continue;
                for (const [sid, sdata] of Object.entries(empData.sites)) {
                    if (filtros.sites.size > 0 && !filtros.sites.has(sid)) continue;
                    for (const cam of sdata.cameras) {
                        dispOpciones.push({
                            value: cam.path,
                            label: cam.titulo || cam.path,
                            sub:   sdata.display,
                        });
                    }
                }
            }
            dispOpciones.sort((a, b) => a.label.localeCompare(b.label, "es"));
            if (dispOpciones.length > 1) {
                cont.appendChild(crearFilterDropdown({
                    titulo:   "Dispositivos",
                    plural:   "dispositivos",
                    opciones: dispOpciones,
                    seleccion: filtros.dispositivos,
                    onChange: (nuevo) => {
                        filtros.dispositivos = nuevo;
                        aplicarFiltros();
                    },
                }));
            }
        }

        // Helpers para validar items contra el universo visible al user actual.
        function sitioVisible(sid) {
            for (const [empId, empData] of Object.entries(JERARQUIA)) {
                if (ROL_USER === "superadmin" && filtros.empresas.size > 0 && !filtros.empresas.has(empId)) continue;
                if (empData.sites[sid]) return true;
            }
            return false;
        }
        function dispositivoVisible(path) {
            for (const [empId, empData] of Object.entries(JERARQUIA)) {
                if (ROL_USER === "superadmin" && filtros.empresas.size > 0 && !filtros.empresas.has(empId)) continue;
                for (const [sid, sdata] of Object.entries(empData.sites)) {
                    if (filtros.sites.size > 0 && !filtros.sites.has(sid)) continue;
                    if (sdata.cameras.some(c => c.path === path)) return true;
                }
            }
            return false;
        }

        // ==================================================================
        // Componente: dropdown con checkboxes (multi-select)
        // ==================================================================
        function crearFilterDropdown({ titulo, plural, opciones, seleccion, onChange }) {
            const wrap = document.createElement("div");
            wrap.className = "filter-dropdown toolbar-group";
            wrap.style.gap = "6px";
            wrap.innerHTML = `<span class="toolbar-group-title">${titulo}</span>`;

            const trigger = document.createElement("button");
            trigger.type = "button";
            trigger.className = "filter-trigger";
            trigger.innerHTML = `
                <span class="trigger-label"></span>
                <svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M4 6l4 4 4-4z"/></svg>
            `;
            wrap.appendChild(trigger);

            const panel = document.createElement("div");
            panel.className = "filter-panel";
            const list = document.createElement("div");
            list.className = "filter-panel-list";
            panel.appendChild(list);
            const footer = document.createElement("div");
            footer.className = "filter-footer";
            footer.innerHTML = `<button type="button" data-action="clear">Limpiar</button>
                                <button type="button" data-action="close">Cerrar</button>`;
            panel.appendChild(footer);
            wrap.appendChild(panel);

            // Estado local: copia de selección que se commitea en onChange.
            const local = new Set(seleccion);

            function refrescarTrigger() {
                const labelEl = trigger.querySelector(".trigger-label");
                if (local.size === 0) {
                    labelEl.textContent = "Todos";
                    trigger.classList.add("is-default");
                } else if (local.size === 1) {
                    const item = opciones.find(o => o.value === [...local][0]);
                    labelEl.textContent = item ? item.label : "1 seleccionado";
                    trigger.classList.remove("is-default");
                } else {
                    labelEl.textContent = `${local.size} seleccionados`;
                    trigger.classList.remove("is-default");
                }
            }

            function renderLista() {
                list.innerHTML = "";
                if (opciones.length === 0) {
                    const e = document.createElement("div");
                    e.className = "filter-empty";
                    e.textContent = `No hay ${plural} disponibles`;
                    list.appendChild(e);
                    return;
                }
                for (const op of opciones) {
                    const row = document.createElement("label");
                    row.className = "filter-option";
                    const cb = document.createElement("input");
                    cb.type = "checkbox";
                    cb.checked = local.has(op.value);
                    cb.addEventListener("change", () => {
                        if (cb.checked) local.add(op.value);
                        else            local.delete(op.value);
                        refrescarTrigger();
                        onChange(new Set(local));   // commit a cada cambio
                    });
                    row.appendChild(cb);
                    const txt = document.createElement("div");
                    txt.style.display = "flex";
                    txt.style.flexDirection = "column";
                    const lab = document.createElement("span");
                    lab.textContent = op.label;
                    txt.appendChild(lab);
                    if (op.sub) {
                        const sub = document.createElement("span");
                        sub.style.fontSize = "11px";
                        sub.style.color = "var(--color-text-soft)";
                        sub.textContent = op.sub;
                        txt.appendChild(sub);
                    }
                    row.appendChild(txt);
                    list.appendChild(row);
                }
            }

            footer.querySelector('[data-action="clear"]').addEventListener("click", () => {
                local.clear();
                renderLista();
                refrescarTrigger();
                onChange(new Set());
            });
            footer.querySelector('[data-action="close"]').addEventListener("click", () => {
                cerrarPanel();
            });

            function posicionarPanel() {
                const rect = trigger.getBoundingClientRect();
                panel.style.top   = (rect.bottom + 6) + "px";
                panel.style.left  = rect.left + "px";
                panel.style.right = "auto";
                // Si el panel se sale por la derecha del viewport, alinearlo al
                // borde derecho del trigger en lugar del izquierdo.
                requestAnimationFrame(() => {
                    const panelRect = panel.getBoundingClientRect();
                    if (panelRect.right > window.innerWidth - 8) {
                        panel.style.left  = "auto";
                        panel.style.right = (window.innerWidth - rect.right) + "px";
                    }
                });
            }
            function abrirPanel() {
                cerrarPanelAbierto();
                renderLista();
                panel.classList.add("open");
                trigger.classList.add("is-open");
                posicionarPanel();
                panelAbierto = { panel, trigger, reposicionar: posicionarPanel };
            }
            function cerrarPanel() {
                panel.classList.remove("open");
                trigger.classList.remove("is-open");
                if (panelAbierto && panelAbierto.panel === panel) panelAbierto = null;
            }

            trigger.addEventListener("click", (ev) => {
                ev.stopPropagation();
                if (panel.classList.contains("open")) cerrarPanel();
                else                                   abrirPanel();
            });

            refrescarTrigger();
            return wrap;
        }

        function cerrarPanelAbierto() {
            if (panelAbierto) {
                panelAbierto.panel.classList.remove("open");
                panelAbierto.trigger.classList.remove("is-open");
                panelAbierto = null;
            }
        }
        // Click fuera de un panel abierto → cerrarlo.
        document.addEventListener("click", (ev) => {
            if (!panelAbierto) return;
            const dentro = ev.target.closest(".filter-dropdown");
            if (!dentro || !dentro.contains(panelAbierto.panel)) {
                cerrarPanelAbierto();
            }
        });
        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape" && panelAbierto) cerrarPanelAbierto();
        });
        // Reposicionar el panel si cambia el viewport mientras está abierto.
        // Y clampear el gridSize si el viewport bajó a mobile con tamaños grandes.
        window.addEventListener("resize", () => {
            if (panelAbierto && panelAbierto.reposicionar) panelAbierto.reposicionar();
            if (clampGridSizeAlViewport()) {
                renderToolbar();
                renderGrid();
            }
        });

        function aplicarFiltros() {
            // Ajustar la página: si el filtro nuevo dejó menos páginas, clamp.
            const total = totalPaginas();
            if (pagina >= total) pagina = Math.max(0, total - 1);
            guardarPreferenciasUI();
            renderToolbar();
            renderGrid();
        }

        function renderGridSizer() {
            const sizer = document.getElementById("grid-sizer");
            for (const btn of sizer.querySelectorAll(".size-btn")) {
                const n = parseInt(btn.dataset.size, 10);
                btn.classList.toggle("active", n === gridSize);
            }
        }

        document.querySelectorAll("#grid-sizer .size-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const n = parseInt(btn.dataset.size, 10);
                if (!TAMANOS_VALIDOS.includes(n) || n === gridSize) return;
                gridSize = n;
                pagina = 0;       // recálculo de páginas
                guardarPreferenciasUI();
                renderToolbar();
                renderGrid();
            });
        });

        // Toggle de ajuste de video (cover / contain) — afecta a TODAS las
        // celdas del grid via la CSS var --video-fit.
        function aplicarFit(mode) {
            if (!FITS_VALIDOS.includes(mode)) mode = FIT_DEFAULT;
            fitMode = mode;
            document.documentElement.style.setProperty("--video-fit", mode);
            document.querySelectorAll("#fit-toggle .fit-btn").forEach(b => {
                b.classList.toggle("active", b.dataset.fit === mode);
            });
        }
        document.querySelectorAll("#fit-toggle .fit-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const mode = btn.dataset.fit;
                if (mode === fitMode) return;
                aplicarFit(mode);
                try { localStorage.setItem(STORAGE_FIT, mode); } catch {}
            });
        });

        function renderPager() {
            const pager  = document.getElementById("pager");
            const info   = document.getElementById("pager-info");
            const prev   = document.getElementById("pager-prev");
            const next   = document.getElementById("pager-next");
            const total  = totalPaginas();
            const cantidad = camarasFiltradas().length;

            // Clamp defensivo (por si algo cambió pagina afuera del flujo normal).
            if (pagina < 0) pagina = 0;
            if (pagina >= total) pagina = Math.max(0, total - 1);

            // Ocultar el pager si todo entra en una sola página.
            if (cantidad <= gridSize) {
                pager.hidden = true;
                return;
            }
            pager.hidden = false;
            info.textContent = `${pagina + 1} / ${total}`;
            prev.disabled = pagina === 0;
            next.disabled = pagina >= total - 1;
        }

        document.getElementById("pager-prev").addEventListener("click", () => {
            if (pagina > 0) { pagina--; renderToolbar(); renderGrid(); }
        });
        document.getElementById("pager-next").addEventListener("click", () => {
            const total = totalPaginas();
            if (pagina < total - 1) { pagina++; renderToolbar(); renderGrid(); }
        });

        // ==================================================================
        // Grid: N slots fijos según gridSize, llenados con cámaras filtradas
        // ==================================================================
        // Importante: las cámaras que sobreviven entre renders (mismos paths
        // siguen en pantalla cuando solo cambió el sizer o el filtro vecino)
        // NO se reconectan — mantenemos su <video> y su RTCPeerConnection.
        // Solo desconectamos lo que se va y conectamos lo que entra nuevo.
        function renderGrid() {
            const grid = document.getElementById("grid");
            const totalFiltradas = camarasFiltradas().length;

            // Caso especial: los filtros activos eliminaron todas las cámaras.
            if (totalFiltradas === 0 && hayAlgunFiltro()) {
                for (const path of [...conexiones.keys()]) desconectar(path);
                grid.classList.add("empty");
                grid.style.removeProperty("--cols");
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⌕</div>
                        <h3>Sin cámaras con esos filtros</h3>
                        <p>Probá quitar algún filtro o seleccionar otros sitios / dispositivos.</p>
                        <p style="margin-top:14px"><button id="btn-limpiar-filtros" class="login-btn" style="width:auto;padding:8px 14px;font-size:13px">Limpiar filtros</button></p>
                    </div>`;
                document.getElementById("btn-limpiar-filtros").addEventListener("click", limpiarFiltros);
                return;
            }

            const cams = camarasEnPaginaActual();
            const pathsEnPagina = new Set(cams.map(c => c.path));

            // 1) Desconectar cámaras que ya no están en la página y quitar
            //    su celda del DOM.
            for (const celda of [...grid.querySelectorAll(".camara")]) {
                if (!pathsEnPagina.has(celda.dataset.path)) {
                    desconectar(celda.dataset.path);
                    celda.remove();
                }
            }
            // 2) Eliminar todos los placeholders (los recreamos en orden).
            for (const vacia of [...grid.querySelectorAll(".celda-vacia")]) {
                vacia.remove();
            }
            // 3) Limpiar empty-state previo si lo hubiera.
            grid.querySelector(".empty-state")?.remove();

            grid.classList.remove("empty");
            grid.style.setProperty("--cols", COLS_POR_TAMANO[gridSize]);

            // 4) Construir el grid en el orden deseado. Para cámaras que ya
            //    existían, appendChild() mueve el nodo sin destruirlo.
            for (let i = 0; i < gridSize; i++) {
                const cam = cams[i];
                if (cam) {
                    const sel = `.camara[data-path="${CSS.escape(cam.path)}"]`;
                    let celda = grid.querySelector(sel);
                    if (!celda) {
                        celda = crearCelda(cam);
                        grid.appendChild(celda);
                        conectar(cam.path, celda);
                    } else {
                        grid.appendChild(celda);   // solo reordena
                    }
                } else {
                    grid.appendChild(crearCeldaVacia());
                }
            }
        }

        function hayAlgunFiltro() {
            return filtros.empresas.size > 0 ||
                   filtros.sites.size > 0 ||
                   filtros.dispositivos.size > 0;
        }

        function limpiarFiltros() {
            filtros.empresas.clear();
            filtros.sites.clear();
            filtros.dispositivos.clear();
            pagina = 0;
            guardarPreferenciasUI();
            renderToolbar();
            renderGrid();
        }

        function crearCeldaVacia() {
            const div = document.createElement("div");
            div.className = "celda-vacia";
            div.innerHTML = `
                <div class="celda-vacia-inner">
                    <div class="icono">○</div>
                    <div class="texto">Sin cámara</div>
                </div>`;
            return div;
        }

        function crearCelda(cam) {
            const celda = document.createElement("div");
            celda.className = "camara";
            celda.dataset.path = cam.path;
            celda.innerHTML = `
                <div class="titulo-cam">
                    <span class="live-dot"></span>
                    <span class="texto"></span>
                </div>
                <video autoplay muted playsinline></video>
                <div class="estado">
                    <div class="spinner"></div>
                    <span class="msg">Conectando…</span>
                </div>
            `;
            celda.querySelector(".titulo-cam .texto").textContent = cam.titulo;
            return celda;
        }

        function setEstado(celda, modo, mensaje) {
            const estadoEl = celda.querySelector(".estado");
            const tituloEl = celda.querySelector(".titulo-cam");
            const msgEl    = estadoEl.querySelector(".msg");
            const spinner  = estadoEl.querySelector(".spinner");

            tituloEl.classList.remove("live", "error");

            if (modo === "live") {
                estadoEl.classList.add("hidden");
                tituloEl.classList.add("live");
                return;
            }

            estadoEl.classList.remove("hidden", "error");
            if (modo === "loading") {
                spinner.style.display = "block";
                msgEl.textContent = mensaje || "Conectando…";
            } else if (modo === "error") {
                spinner.style.display = "none";
                estadoEl.classList.add("error");
                tituloEl.classList.add("error");
                msgEl.textContent = mensaje || "Sin señal";
            }
        }

        // ==================================================================
        // Cliente WHEP (non-trickle) con Authorization header
        // ==================================================================
        async function conectar(path, celda) {
            const prev = conexiones.get(path);
            if (prev?.retryTimer) clearTimeout(prev.retryTimer);

            const generation = (prev?.generation || 0) + 1;
            conexiones.set(path, { pc: null, retryTimer: null, generation });

            const videoEl = celda.querySelector("video");
            setEstado(celda, "loading", "Conectando…");

            let pc = null;
            try {
                pc = new RTCPeerConnection();
                pc.addTransceiver("video", { direction: "recvonly" });

                pc.ontrack = (ev) => {
                    if (!esActual(path, generation)) return;
                    const [stream] = ev.streams;
                    if (videoEl.srcObject !== stream) videoEl.srcObject = stream;
                    setEstado(celda, "live");
                };

                pc.oniceconnectionstatechange = () => {
