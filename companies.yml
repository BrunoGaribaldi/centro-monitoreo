# =====================================================================
# Configuración de empresas, sites, cámaras y usuarios
# Centro de Monitoreo de Drones · NQN Petrol
#
# Las CONTRASEÑAS NO viven acá — viven en authelia/users_database.yml.
# Authelia maneja autenticación (login, sesión, 2FA, brute force, audit).
# Este archivo solo mantiene el mapping de usuarios a empresa/rol/sites/paths
# para que el auth-service decida qué cámaras puede ver cada user.
#
# Estructura de paths:
#   dron-cam-q{N}-angular      cámara angular del dron N
#   dron-cam-q{N}-infrarojo    cámara infrarroja del dron N
#   dron-cam-q{N}-zoom         cámara zoom del dron N
#   dock-cam-dock-{N}          cámara fija del dock N
# =====================================================================

