# =====================================================================
# Usuarios
#
# Roles disponibles:
#   superadmin     → cross-empresa, ve TODAS las cámaras de TODAS las empresas
#                    (no requiere campo `empresa`)
#   admin_empresa  → ve todos los sites y drones de su empresa
#   admin_site     → ve todos los drones de los sites listados en "sites"
#   viewer_drone   → ve solo los drones listados en "allowed_paths"
#
# El `username` debe coincidir EXACTAMENTE con la entrada en
# authelia/users_database.yml. Authelia inyecta el header `Remote-User`
# con ese valor y el auth-service hace el lookup acá.
# =====================================================================

users:
  # Superadmin (dueño del centro de monitoreo) — sin empresa, ve todo
  - username: ingenieria
    rol: superadmin

  # Admin completo de QUINTANA — ve todo lo de la empresa (40 cámaras)
  - username: admin_quintana
    empresa: QUINTANA
    rol: admin_empresa

  # Supervisor de Cañadón Amarillo — ve Q1-Q4 (16 cámaras)
  - username: supervisor_ca
    empresa: QUINTANA
    rol: admin_site
    sites:
      - canadon-amarillo

  # Operador de una sola cámara
  - username: operador_angular
    empresa: QUINTANA
    rol: viewer_drone
    allowed_paths:
      - dron-cam-q1-angular
