# =====================================================================
# Configuración de empresas, sites, cámaras y usuarios
# Centro de Monitoreo de Drones · NQN Petrol
#
# Las CONTRASEÑAS NO viven acá — viven en authelia/users_database.yml.
# Authelia maneja autenticación (login, sesión, 2FA, brute force, audit).
# Este archivo solo mantiene el mapping de usuarios a empresa/rol/sites/paths
# para que el auth-service decida qué cámaras puede ver cada user.
# =====================================================================

companies:
  QUINTANA:
    display: "Quintana Energy"
    sites:
      canadon-amarillo:
        display: "Cañadón Amarillo"
        cameras:
          - path: dron-cam-q1-angular
            titulo: "Q1 · Angular"
          - path: dock-cam-dock-1
            titulo: "Dock 1"
      canadon-leon:
        display: "Cañadón Leon"
        cameras:
          - path: dron-CL
            titulo: "CL · angular"
          - path: dock-CL
            titulo: "CL · dock"
        # Estaciones meteorológicas WeatherFlow Tempest del sitio.
        # Si el sitio tiene varias estaciones, agregar más items.
        # Si no tiene ninguna, omitir la key `weather_stations`.
        # Los `limits` son opcionales: si no se ponen, se usan defaults globales.
        weather_stations:
          - station_id: 217302
            display: "Tempest CL"
            # limits:
            #   wind_avg_warn: 10
            #   wind_avg_danger: 12
            #   wind_gust_warn: 15
            #   wind_gust_danger: 17
            #   lightning_warn_km: 30
            #   lightning_danger_km: 10
      efo:
        display: "EFO"
        cameras:
          - path: dron-efo-angular
            titulo: "efo · angular"
          - path: dock-efo
            titulo: "efo · dock"


  SEI: 
    display: "Grupo SEI Sacatuc S.R.L."
    sites:
      prueba1:
        display: "no conozco los sites de sei"
        cameras:
          - path: path-prueba1
            titulo: "prueba1 sei"

# =====================================================================
# Usuarios
#
# Roles disponibles:
#   superadmin     → cross-empresa, ve TODAS las cámaras de TODAS las empresas
#                    (no requiere campo `empresa`)
#   admin_empresa  → ve todos los sites y drones de su empresa
#   admin_site     → ve todos los drones de los sites listados en "sites"
#   viewer_drone   → ve solo los drones listados en "allowed_paths"
#
# El `username` debe coincidir EXACTAMENTE con la entrada en
# authelia/users_database.yml. Authelia inyecta el header `Remote-User`
# con ese valor y el auth-service hace el lookup acá.
# =====================================================================

users:
  # Superadmin (dueño del centro de monitoreo) — sin empresa, ve todo
  - username: ingenieria
    rol: superadmin

  #Admin completo de SEI
  - username: admin_sei
    empresa: SEI
    rol: admin_empresa

  # Admin completo de QUINTANA — ve todo lo de la empresa
  - username: admin_quintana
    empresa: QUINTANA
    rol: admin_empresa

  # Supervisor de Cañadón Amarillo — ve solo ese site
  - username: supervisor_ca
    empresa: QUINTANA
    rol: admin_site
    sites:
      - canadon-amarillo

  # Operador de una sola cámara
  - username: operador_angular
    empresa: QUINTANA
    rol: viewer_drone
    allowed_paths:
      - dron-cam-q1-angular
